      - "Prefer concrete file-path + line evidence over generic advice."
      - "Answer specifically: does anything already run a retrieval agent and store a per-run trajectory? What is reusable for runs/*.jsonl + meta.json? What is the authoritative known-correct-policy source for the oracle? Where should the runner + runs/ live?"

        runs_location: "/home/clawd/mdplus-denial-agent-lab/runs/ (new dir; NOT git-ignored, unlike outputs/)"
        retrieval_honesty: "Agent handed a small candidate set of payer-domain URLs (true UHC surgery-knee PDF + >=1 plausible-but-wrong payer URL), picks one, runner performs a REAL HTTP fetch of the pick and logs each step to jsonl; oracle compares fetched result to Sheet ground truth. The answer URL must NOT be fed straight into the agent's choice."

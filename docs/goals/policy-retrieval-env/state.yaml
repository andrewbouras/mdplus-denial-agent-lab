# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Policy-retrieval trajectory environment — KISS v0"
  slug: "policy-retrieval-env"
  kind: existing_plan
  tranche: "Produce ONE real stored trajectory (jsonl + meta with automatic oracle) for one policy-retrieval row, plus a thin CLI reader/labeler, reusing existing repo machinery. Stop for review before more rows, batch oracle, parallelism, or any UI."
  status: done
  oracle:
    signal: "For the chosen row, run_XXXX.meta.json.oracle.correct is computed by comparing the agent's retrieved policy id to the known-correct governing policy (right plan variant + current version) in the ground-truth registry (data/policy_platform/source_registry.json and/or the consolidated Google Sheet)."
    cadence: "after each Worker package and at final audit"
    final_proof: "A real runs/run_XXXX.jsonl + runs/run_XXXX.meta.json produced by an actual retrieval run (not hardcoded), whose oracle verdict was computed from ground truth, readable and labelable via the thin CLI."
  intake:
    original_request: "can we build the full rl environment to be ran for our use cases? (narrowed to: policy-retrieval use case, start KISS / bare essentials)"
    interpreted_outcome: "For one row, an agent actually attempts policy retrieval and writes a real structured trajectory to disk (jsonl steps + meta with automatic oracle), readable and labelable — proving the storable data unit before any dashboard."
    input_shape: existing_plan
    audience: "Andrew (domain/product lead) + human reviewers; downstream buyer = frontier labs"
    authority: requested
    proof_type: artifact
    completion_proof: "One real runs/run_XXXX.jsonl + runs/run_XXXX.meta.json for one row, oracle computed from ground truth, readable/labelable via thin CLI. Not hardcoded."
    likely_misfire: "Rebuilding the fleet/cockpit UI or the full RL environment (reward shaping, branching, 5 streams) before one real stored trajectory exists; or faking the trajectory with scripted data again; or over-engineering storage (DB) when two flat files suffice."
    blind_spots_considered:
      - "The HTML mockup stores nothing — every value is hardcoded; real storage does not exist yet."
      - "Repo already targets policy-retrieval agents (pyproject) and ships source_registry.json + criteria_extractions.json — map and reuse, don't reinvent."
      - "Oracle must be automatic (compare to ground truth), not human-declared, or output is just annotated data."
      - "PHI: policy retrieval uses public payer docs — no patient data; keep it that way."
      - "Full RL env is the endgame, not v0."
    existing_plan_facts:
      - "Data unit = two flat files per run: runs/run_XXXX.jsonl (one JSON line per step) + runs/run_XXXX.meta.json (row + oracle + human label)."
      - "Minimal step line: {i, action, choice/args, obs, self_verdict}."
      - "Minimal meta: {row, payer, plan, cpt, target, oracle:{correct,reachable,reward}, label:{fail_state,failure_type,expert_action}}."
      - "Build order: (1) schema+storage, (2) one real run writes them, (3) thin reader/labeler."
      - "Durable home = this repo; not the card folder (sync reverts), not /tmp (ephemeral)."
      - "Task is policy retrieval only, not filing appeals."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "node /home/clawd/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/policy-retrieval-env"

active_task: null

tasks:
  - id: T001

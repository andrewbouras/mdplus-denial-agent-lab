        - "authoring.PolicyIndex + build_anchor_snapshot map a criteria_id to governing source_id/official_url/effective_date/source_sha256 = per-row correct-policy anchor"
        - "source_review.source_fingerprint is the ready-made comparator for oracle.correct"
        - "results.validate_arm_result validates a retrieval result against the contract"
        - "Existing trajectory format = hash-chained JSONL event logs per episode under outputs/ (git-ignored); CLI in synthetic_harness/cli.py"
        - "External ground-truth candidate: Google Sheet final_consolidated id 1Im48XYqt50prRy46Rvtfl7ge96hy7dA58M5wElwTHjs (company/plan/state/target_url/retrievability_grade/doc_id); service-account key /home/clawd/.config/gog/service-account.json (non-interactive)"
      contradictions:
        - "Repo self-describes as launching retrieval agents with a source_registry/criteria dataset, but the committed source_registry.json and criteria_extractions.json are empty ([]) — no local ground-truth data to compute an oracle without the private library or the external Sheet"

        - "How to compute oracle.correct: exact match on source sha256/fingerprint, official_url/target_url, or source_id? source_fingerprint expects a rich source dict; Sheet only has target_url + doc_id"
        - "oracle.reachable and oracle.reward have no existing analog; Judge must define them (likely reachable = target_url resolves + content verified from Sheet retrievability_grade)"

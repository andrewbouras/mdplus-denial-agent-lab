      summary: "Repo already runs isolated retrieval agents and writes per-run trajectories, but as hash-chained EPISODE dirs under outputs/synthetic_patient_simulations/episodes/, not the KISS runs/run_XXXX.{jsonl,meta.json} form. Reusable: arms.result_schema()/result_contract() (case_identification.payer/plan/cpt/procedure + retrieval.selected_source), results.validate_arm_result, source_review.source_fingerprint (oracle comparator), authoring.PolicyIndex + build_anchor_snapshot (per-row correct-policy anchor), CLI list-candidates. CRITICAL GAP: committed source_registry.json + criteria_extractions.json are EMPTY ([]); local ground truth is per-episode sealed/encrypted, not a per-row correct policy. No automatic oracle.correct exists yet. External candidate: consolidated Google Sheet (company/plan/state/target_url/retrievability_grade/doc_id), non-interactive service-account key. Judge must pick the truth source and define reachable/reward."
      evidence:
        - "synthetic_harness/episode.py:44-58,111-145 — per-episode dir with hash-chained *.events.jsonl logs (existing trajectory store, not runs/run_XXXX.jsonl)"
        - "synthetic_harness/arms.py:74-176 — result_contract/result_schema: case_identification.payer/plan_name/product_type/state/procedure/cpt + selected_source (title,url,path,sha256,evidence_role)"
        - "synthetic_harness/arms.py:268-320 — agent_prompt runs a real retrieval attempt, writes result.json + agent_events.jsonl"
        - "synthetic_harness/authoring.py:59-172 — PolicyIndex loads registry+criteria (keyed source_id/criteria_id); build_anchor_snapshot yields per-row governing source_id/official_url/effective_date/source_sha256"
        - "synthetic_harness/authoring.py:175-344 — ground truth is openssl-encrypted per-episode (sealed/ground_truth.enc), controller-key gated; NOT a plain per-row oracle"
        - "synthetic_harness/source_review.py:73-87 — source_fingerprint(): canonical hash to compare retrieved vs known source"
        - "synthetic_harness/results.py:15-63 — validate_arm_result reusable"
        - "data/policy_platform/source_registry.json + criteria_extractions.json — both committed as empty '[]' (wc -c = 3); real data git-ignored"
        - "synthetic_harness/cli.py:81-246 — CLI entrypoint convention (list-candidates, author-case); default outputs/ roots"
      facts:

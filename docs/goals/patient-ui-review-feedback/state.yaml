        - "Memory attributes the progress BAR to Version A (mobile); in code the bar is in Version B, while A uses a side-rail roadmap."
      ambiguity_requiring_judge:
        - "Which repo file the team means by 'desktop version 1/3' (map/=A vs checklist-steps/=B)."
        - "Whether the 12-row taxonomy CSV is an acceptable stand-in for the missing Akin ~20-procedure doc, or that source must be obtained first."

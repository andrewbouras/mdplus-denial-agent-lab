# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "OrthoAppeals patient-UI — implement Dr. Kassam review-call feedback"
  slug: "patient-ui-review-feedback"
  kind: existing_plan
  tranche: "Implement the 7 review-call feedback items into the existing static mockups (mockups/ in the clone), verify each in a browser, then serve the result over a shareable /url link Andrew can open. Continuous execution until all 7 items are reflected and the link is live; stops short of the 'Build my appeal packet' backend CTA (intentionally TBD)."
  status: complete
  oracle:
    signal: "Andrew (and uncoached parents/grandparents) open the updated mockups over a shared HTTPS /url link and confirm the review-call feedback is visibly reflected: denial-letter upload is prominent/near-mandatory with phone-photo capture, conservative-care questions are recency-based with 2-of-4 + prepopulated yes, procedure picker is category→subtype drilldown, imaging is body-part conditional, a State question gates the insurer list, and an optional voice-friendly 'tell us your story' field exists — with the mobile=A / desktop=1-or-3 split honored."
    cadence: "after each Worker package and at final audit"
    final_proof: "A live shared /url link (WebFetch-verified 200 + content) showing all 7 items implemented in the mockups, plus a receipt itemizing which mockup file/screen carries each of the 7 changes."
  intake:
    original_request: "have you done /goal-prep to accomplish all of this actionable items or just documented that they need to be done? can we do recon, dev, and dogfood if we haven't done so already"
    interpreted_outcome: "Turn the documented Dr. Kassam review-call UI decisions into actual implemented changes in the mockups, then dogfood them via a shareable link."
    input_shape: existing_plan
    audience: "Primary: patients appealing a denied knee replacement (incl. low-tech-comfort older adults; the stress-test cohort is uncoached parents/grandparents). Secondary: Dr. Kassam (clinical advisor), Anish, Jocelyn, Andrew (product/domain lead)."
    authority: approved
    proof_type: demo
    completion_proof: "Andrew opens the shared link and sees all 7 review-call items reflected; the mobile/desktop split is honored; the 'Build my appeal packet' end step is intentionally left TBD."
    likely_misfire: "Building a brand-new UI from scratch or re-synthesizing coded flows instead of editing the EXISTING mockups (mockups/ is source of truth); over-polishing one screen while skipping items; treating documentation/board-creation as completion; making denial-letter upload merely present instead of prominent/near-mandatory; adding date/session-count questions the call explicitly dropped; wiring the real appeals-engine backend."
    blind_spots_considered:
      - "Two open questions materially shape the desktop build: (a) desktop = version 1 vs version 3 (team leaned 1/3, Jocelyn preferred 3); (b) the location/contents of Akin's ~20-procedure list."
      - "Mobile camera/photo capture must actually work on a phone (getUserMedia / file input capture=environment), not just look present."
      - "Voice-to-text for the story field is a real capability (Web Speech API) with browser-support caveats; provide graceful fallback to typing."
      - "State→insurer gating needs the per-state plan list from the consolidated Sheet/dataset; for CA that is ~12 plans."
      - "Prepopulating conservative-care answers as 'yes' means the letter will assert 'tried it, didn't work' — the UI copy must let the patient correct a wrong prepopulation."
    existing_plan_facts:
      - "Mockups are STATIC HTML in the clone at mockups/: index.html, map/, checklist-steps/, assets/base.css, assets/data.js. This is source of truth; the card-folder copy re-syncs, so edit the clone."
      - "A prior board (docs/goals/patient-appeal-ui in the card session) delivered the initial divergent mockups; that tranche (pick a direction) is complete. This board is the NEXT tranche: implement the chosen direction + review-call refinements."
      - "All 7 decisions and their clinical rationale are captured in memory/project_ui_review_call.md (the durable record of the ~2026-07-12 call)."
      - "Item 1 (denial-letter upload) is top priority / near-mandatory per both Dr. Kassam and Anish/Jocelyn."
      - "Conservative-care model: 4 forms = activity modification, anti-inflammatories, injections, formal PT; patient typically must have tried 2 of 4; ask by RECENCY ('last 6 months', helpful/lasting), prepopulate yes, do NOT ask session counts / months up front."
      - "Imaging conditional: knee → x-ray; shoulder/others → also advanced imaging (MRI)."
      - "Procedure picker: category (Knee/Hip/Shoulder/Foot & Ankle/Spine) → subtype dropdown (~20 procedures) or free text."
      - "Add a State question and use it to gate the insurer list to plans available for that state."
      - "Optional 'tell us your story' free-text, voice-to-text friendly (esp. mobile), with a fallback prompt when structured answers are insufficient; personal framing throughout; conditional pronoun/gender logic."
      - "Mobile = version A (single big button, one question at a time, progress bar); desktop = version 1 or 3 (auto-does-more, scroll). Serve A on phone, 1/3 on desktop."
      - "Do NOT build the 'Build my appeal packet' final CTA — intentionally TBD this tranche."
      - "Use the frontend-design skill during dev; dogfood via the /url skill and verify with WebFetch (local curl returns NXDOMAIN here)."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/patient-ui-review-feedback/"
    command: "node /home/clawd/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /home/clawd/mdplus-denial-agent-lab/docs/goals/patient-ui-review-feedback"


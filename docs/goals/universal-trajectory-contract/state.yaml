      summary: "Plinth contract (capture-trace.ts) + TraceWriter API are reusable AS-IS to write a conformant run-dir for ANY URL; action/observation/decision payloads are opaque so payer-navigation steps drop in unchanged. Constraints: PROJECT_SLUG='synthetic-emr-demo' is hardcoded in BOTH writer (capture-trace.ts:22) and reader (read-trace.ts:13), plus runId regex run_[a-f0-9]{12}; to be consumed by the existing viewer WITHOUT forking read-trace.ts our run must reuse that slug + id format. Screenshots pair to steps by step_id via ArtifactRecord.storage_key (NOT step_idx filename, NOT timestamp); leaf at runs/<runId>/<step_id>/screenshot.png. A runnable node/tsx --test harness (__harness__/replay.test.ts) exercises the REAL timeline+validator. CRUX: ground truth is a direct deep-link PDF, so per-step screenshots are cosmetic unless the agent genuinely browses a real UHC provider policy-search surface. Playwright is wired (demo:capture) but NO ms-playwright Chromium is installed. Oracle->rating mapping is clean. kiss-venv has zero browser deps."

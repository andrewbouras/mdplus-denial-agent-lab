# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Universal trajectory contract for policy retrieval (real browser + Plinth replay/rate)"
  slug: "universal-trajectory-contract"
  kind: existing_plan
  tranche: "One real browser-retrieval trajectory for one row (UHC Commercial, CPT 27447) emitted into the Plinth synthetic-emr trajectory contract so the existing replay+rate UI/harness consumes it, with the computed oracle preserved and pre-filling the rating. Not the whole 39-row set."
  status: done
  full_outcome_complete: true
  oracle:
    signal: "A REAL multi-step browser-retrieval run for the UHC/CPT-27447 row produces a run-dir containing trace.jsonl (RunHeader + per-step StepRecord + ArtifactRecord), per-step step_<id>/screenshot.png captured from genuine navigation, and training-unit.json — all conforming to Plinth capture-trace.ts types — such that the existing Plinth replay player/harness loads and plays the run, and our computed oracle (kiss_oracle URL host+path compare) pre-fills training-unit rating.failure_step_idx + failure_type=retrieval which an operator can confirm/correct."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed: (1) schema-conformance check of the emitted trace.jsonl + training-unit.json against Plinth StepRecord/ArtifactRecord/RunHeader/TrainingUnit types; (2) a replay/harness render that plays the real per-step screenshots in step order and pins the oracle-derived failure step; (3) kiss_oracle discrimination tests still pass (wrong URL -> correct=false/reward=0); (4) evidence the trajectory is genuinely multi-step and non-faked (>1 real navigation step, real screenshot bytes, real fetched policy sha256)."
  intake:
    original_request: "we need ours to have per step screenshots and adhere moreso to what we have there but for our use-case ... i want one universal solution ... lets do your recommendation (real browser retrieval)"
    interpreted_outcome: "Policy-retrieval env emits real browser trajectories into the same Plinth trajectory contract (trace.jsonl + per-step screenshots + training-unit.json) so one universal replay+rate review surface handles it, while preserving the computed auto-oracle."
    input_shape: existing_plan
    audience: "Andrew (product/domain lead) + operators who review+rate captured agent runs on the universal Plinth surface"
    authority: approved
    proof_type: demo
    completion_proof: "A real multi-step browser trajectory for one row stored in the Plinth run-dir contract, consumed by the Plinth replay UI/harness, computed oracle preserved and pre-filling the rating; verified by schema check + replay/harness render + oracle tests + non-faked evidence."
    likely_misfire: "Succeeding at the wrong thing by: (1) faking the trajectory (single deep-link PDF fetch dressed as multi-step, or synthesized screenshots); (2) drifting the schema so the Plinth replay UI cannot actually consume our runs; (3) letting the human rating replace/override the computed oracle instead of the oracle pre-filling it; (4) rebuilding a capture engine from scratch instead of reusing browser-trace + synthetic-emr-runner; (5) editing existing Plinth app files or the validated kiss_oracle logic destructively."
    blind_spots_considered:
      - "Deep-link reality: current ground-truth target is a direct PDF URL; a genuine multi-step trajectory requires a real navigation surface (payer provider portal or search) to drill to that PDF, else screenshots are cosmetic."
      - "Engine coupling: synthetic-emr-runner.ts is written for the synthetic-EMR app + Plinth storage-key minting; reuse may need light adaptation to point at an arbitrary payer URL and to write into a repo-local run-dir."
      - "Two run-dir conventions exist (KISS runs/ flat vs Plinth $HOME/clawd/state/... run-dir); the emitted contract must land where the replay UI/harness reads it."
      - "Oracle-to-rating mapping: kiss_oracle{correct,reachable,reward} must map onto training-unit rating{outcome,verdict,failure.failure_step_idx,failure_type,severity} without the human being able to flip reward."
      - "PEP 668 / Playwright not in kiss-venv; capture likely stays in the Node browser-trace engine, invoked from the Python runner via subprocess."
      - "Live click-through may be env-blocked (single dev server per app dir; prod off-limits) — a sanctioned harness render exercising the REAL replay timing/alignment on the real screenshots is acceptable proof."
    existing_plan_facts:
      - "Chosen fork = real browser retrieval (user-approved). Agent genuinely navigates a payer provider portal/search to find the governing medical-necessity policy PDF for the UHC Commercial CPT 27447 row."
      - "Emit per-step Playwright screenshots step_<id>/screenshot.png + trace.jsonl (RunHeader + StepRecord + ArtifactRecord) + training-unit.json in the Plinth run-dir contract."
      - "Preserve the computed oracle (synthetic_harness/kiss_oracle.py, URL host+path compare, never hardcoded True). Oracle pre-fills training-unit rating.failure_step_idx + failure_type=retrieval; operator confirms/corrects; human label never flips reward."
      - "Reuse the existing Playwright+CDP browser-trace engine (/home/clawd/.claude/skills/browser-trace + plinth-app workers/synthetic-emr-runner.ts + workers/lib/capture-trace.ts) rather than building capture from scratch."
      - "KISS: one row, one real browser trajectory this tranche. Not the whole 39-row set."
      - "Existing validated KISS files (scripts/run_policy_retrieval.py, synthetic_harness/kiss_oracle.py, runs/run_0001.*) already exist; the auto-oracle is the load-bearing part to preserve, not rewrite."
      - "Do not edit existing Plinth app files or prod :3010. Reference Plinth schemas/engine read-only; adapt via a repo-local wrapper if needed."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed


        - "read-trace.ts:13 slug hardcoded; :72-84 tracePath=$HOME/clawd/state/projects/synthetic-emr-demo/runs/<runId>/trace.jsonl; isSafeRunId=/^run_[a-f0-9]{12}$/; artifacts grouped by step_id; :138-148 screenshotDataUri finds screenshot artifact for a step_id, resolveFile(storage_key)->base64 (pairing by step_id+storage_key)"

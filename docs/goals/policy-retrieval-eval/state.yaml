    receipt:
      result: done
      evidence:
        - "scripts/run_policy_retrieval.py L61-109 build_candidates/rank_and_select; L211-213 self_verdict"
        - "synthetic_harness/kiss_oracle.py L38-47 urls_match/compute_oracle"
        - "scripts/emit_row_trace.py L43,L59,L192,L205"
        - "runs/run_0001.jsonl (6 lines), runs/run_0001.meta.json"
        - "data/policy_platform/seed_review_39_spec.json 39 rows, 3 shapes, 13 with target_url"
        - "grep fetch(|XMLHttpRequest|axios|/api|endpoint in mockups/ -> zero matches"
        - "mockups/checklist-steps/index.html L92 state object A, L457 restUnlocked gate"
        - "tests/ has 4 pytest files; pyproject testpaths=['tests']; pytest not installed"
        - "data/policy_platform/criteria_extractions.json and source_registry.json are []"
      summary: "A per-row retrieval runner exists but calls NO model. It is keyword-overlap ranking plus a real HTTP fetch, and build_candidates injects the ground-truth URL into its own candidate set, so it cannot be reused for a cold run. No confidence signal, no abstention path, and no judge model exist in the retrieval path. mockups/ is confirmed fully static with zero network calls. Only 13 of 39 spec rows carry a target_url, and the row schema is non-uniform across three shapes."
      key_findings:
        - "scripts/run_policy_retrieval.py L61-109: build_candidates() injects row.ground_truth.target_url into the candidate list; rank_and_select() always returns scored[0]. There is no abstention. This function is UNUSABLE for a cold eval without a rewrite."
        - "No Anthropic SDK, no OpenAI SDK, no API key read, and no WebSearch exist anywhere in scripts/ or browser_capture/. The retrieval path is entirely deterministic Python and Node."
        - "The only field resembling confidence is self_verdict at run_policy_retrieval.py L211-213, a hardcoded English string chosen by an if on HTTP status. It is not a self-assessed certainty and has no scale."
        - "No judge/grader model step exists for retrieval. Grading is synthetic_harness/kiss_oracle.py compute_oracle(), a normalized host+path URL equality check returning reward 1/-1, plus manual human labels written by scripts/read_run.py into meta.json['label']."
        - "synthetic_harness/evaluation.py L200 contains a judge PROMPT STRING with a 0-4 rubric and a not_judgeable enum, but nothing calls a model with it. It belongs to the unrelated synthetic-patient harness."
        - "seed_review_39_spec.json has THREE distinct row shapes: public (13 rows, has target_url), login_gated (20 rows, has portal_url), no_public_policy (6 rows, no URL field). 26 of 39 rows have no target_url at all."
        - "mockups/ confirmed static: grep for fetch(|XMLHttpRequest|axios|/api|endpoint returned ZERO matches. assets/data.js L6 states verbatim 'Nothing here makes a network call.' No package.json, no build step."
        - "Website seam is mockups/checklist-steps/index.html L457 inside updateLocks(): 'const restUnlocked = insUnlocked && !!A.insurer;'. This is the first moment all retrieval inputs exist. State object A declared at L92. Available: A.surgery, A.catId, A.bodyPart, A.state, A.insurer. CPT exists in assets/data.js procedureCategories but is NEVER copied onto A. The mirror flow mockups/map/index.html has the same gate chain and needs the same insertion."
        - "Trace schema in runs/*.jsonl: {i:int, action:str, args:obj, obs:str, self_verdict:str}. Actions: load_row, build_candidates, rank_select, fetch, inspect, return_policy. runs/ holds exactly ONE run, from 2026-07-12."
        - "data/policy_platform/criteria_extractions.json and source_registry.json are both literally []. source_registry.csv is a header row only."
        - "browser_capture/capture_policy_row.mjs needs NO credentials; login_gated rows deliberately dead-end at reward -1. It cannot run today because Playwright is unresolvable (~/.cache/ms-playwright empty), though /snap/bin/chromium and /usr/bin/chromium-browser are present."
      contradictions_to_board:
        - "Board recorded gate_suite as 'none. This repo has no test suite.' REFUTED as to source: tests/ contains test_kiss_run.py, test_oracle_to_rating.py, test_plinth_contract_conformance.py, test_synthetic_harness.py, verify_artifact_sha.py, and pyproject.toml sets testpaths=['tests']. CONFIRMED as to executability: pytest is not installed and there is no .venv, so nothing runs today."
        - "T004 constraint says 'Reuse whatever T001 found already exists; do not rebuild a runner that is already present.' The runner that is present is answer-leaking keyword matching with no model. It cannot be reused for a cold model eval."
      ambiguity_requiring_judge:
        - "Only 13 of 39 rows carry a target_url. Whether the corrected key covers 39 rows or only the 13 public ones changes the scope of every downstream task."
        - "Whether run_policy_retrieval.py is reusable scaffolding or dead code for the cold-eval purpose."
      verification_run:

    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      summary: 'PROMOTE bm_0058 from unverified to retrievable, basis deferral_two_part, but ONLY on an
        extended verbatim quote that the PM''s submitted quote omitted, and with a new plan_type_named
        field that marks this row instrument_inferred rather than explicit. Two PM errors corrected: the

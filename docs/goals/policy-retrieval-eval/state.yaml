        EXCLUDED: invalid 1 (bm_0063), unverified 4 (bm_0068, bm_0079, bm_0086, bm_0089). N_scored 34
        across 11 payers. RETRIEVABLE 11 rows / 7 unique documents / 4 unique issuers. Strong subset 9
        rows / 6 documents / 3 issuers, or 8 rows / 5 documents / 3 issuers when instrument-inferred rows
        are excluded. GATED 17. NONE 6. Arithmetic: 11+17+6=34; 34+4+1=39. MA scored rows 9. NEEDS_HUMAN_REVIEW
        not-reportable trigger stays at 20 percent of N_scored, so h >= 7 of 34.'
      ruling_3_document_and_payer: Counted document for bm_0058 is A57685 (companion billing and coding
        article to L36575, Noridian J-E), which zero existing retrievable rows use, so unique documents
        move 6 to 7. Issuer is CMS, already counted, so unique issuers stay 4 and the strong-subset issuer
        count stays 3. Blue Shield of California is already a scored payer via bm_0090 (Medicaid, class
        none), so no twelfth payer is added and scored_payers stays 11.
      ruling_3_incentive_audit: 'Stated as required. The promotion IS flattering: the 95 percent upper
        bound on retrieval error improves from 39.3 percent at N=6 to 34.8 percent at N=7. The Judge weighed
        this and it did not drive the ruling. Two facts limit the flattery and are recorded so the report
        cannot overstate it. The issuer bound does not move at all: 4 issuers, and 3 in the strong subset,
        giving 63.2 percent, which remains the binding constraint on the retrieval side. The headline
        confident-wrong metric is unaffected in kind; its denominator moves 33 to 34, an 8.7 to 8.4 percent
        bound.'
      ruling_4_bm0068_bm0079: 'KEEP UNVERIFIED. Do not reclassify gated. The PM''s own reasoning is correct
        and is adopted: ''probably behind a login'' is a guess, and gated is supposed to mean established.
        Four independent negative checks (policy PDF term counts all zero, medical policy index, medical
        policy list page, prior authorization list PDF) establish absence of a public scope statement,
        not the presence of a gated one. Reclassifying on a guess would inflate the honest-abstention
        denominator with rows we never proved.'
      ruling_5_carefirst: The PM's Maryland pin is sound and needs no Judge action. The recorded consequence,
        that a Northern Virginia CareFirst member is governed by L33456 (Palmetto J-M) not L36007, is

      summary: 'Eval harness built as 17 modules under scripts/policy_eval, implementing the rubric. Key
        isolation is structural on three levels: a six-field question set, a pre-call prompt scan against
        a key-derived inventory of URLs, hosts and doc ids, and a subprocess with every built-in tool
        stripped running outside the repo. Grading is Stage A deterministic with Stage B blindfolded to
        the retrieval model''s rationale, alternatives and confidence. Committed as 822cd29, 18 files,
        4495 insertions. The answer key and the board were not touched.'
      isolation_proved_not_asserted: The test has a control arm. With file reading enabled and cwd set
        to the repo, the model read a canary string out of answer_key_v1.json and printed it. With the
        real isolated invocation it returned CANNOT_READ_FILE, made zero tool calls, and named the two
        provided tools as its only capability. All four probes against file://, localhost, loopback and
        the cloud metadata address were blocked. Without the control arm the test could have passed because
        the prompt confused the model rather than because isolation works.
      search_path_exercised: The 2-row run made 78 real tool calls, including roughly 40 searches on a
        single row before the model abstained. This matters because a broken search tool and an honest
        abstention are indistinguishable in the output. It also substantially discharges T014's evidence
        requirement, leaving only the written note.
      finding_1_self_test_caught_a_dead_assertion: The denominator check was passing while comparing nothing.
        Its parser stopped at the first line containing three dashes, which is the markdown table's own
        separator row, so it returned an empty pinned table and then reported zero disagreements while
        printing ALL DENOMINATOR ASSERTIONS PASSED. The drift self-test that T004 was required to write
        is what exposed it. It now parses all 18 values and raises if the parse comes back short. This
        is the strongest available argument for requiring negative tests on every guard in this harness.
      finding_2_pm_arithmetic_error: The harness computed from the formula rather than copying the rubric
        prose, and caught a PM error. Rubric v1.3 attached 63.2 percent to N=4 issuers in both section
        0.1 and the section 7 template. The exact binomial gives 52.7 percent at N=4; 63.2 percent is
        the N=3 value. This is the same class of error Judge T012 caught once already, when 46 percent
        was circulated for N=6. The Worker did not edit the rubric, correctly, because that needs a version
        bump. PM verified the arithmetic independently and issued rubric v1.4.
      finding_3_stale_caveats_block_t005: The answer key's known_limitations is stale for the promoted
        key. It still says 6 unique documents across 10 rows and still lists bm_0058 among five unverified
        rows. Rubric section 9 requires byte-for-byte copying, and the key was frozen for T004, so the

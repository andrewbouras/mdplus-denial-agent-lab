  - id: T012
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: Rule on the four scoring questions T003 surfaced, so the grader can be built against a
      complete and honest class list rather than an improvised one.
    context: T003 returned a defensible key that does not fit rubric v1.1's four-class model. It added
      a fifth class and two weak-basis rows, and it exposed that the retrievable side is far less independent
      than its row count suggests. These are definition questions, and rubric discipline requires they
      be settled BEFORE any run, not after results are visible. T005 has not executed. This is the last
      moment these can be decided cleanly.
    inputs:
      - data/policy_platform/answer_key_v1.json
      - docs/goals/policy-retrieval-eval/notes/key-corrections.md
      - docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md (v1.1)
      - T003 receipt on this board
    constraints:
      - READ ONLY. Rule and record. Do not edit the key, the rubric, or the harness. The PM applies rulings.
      - 'RULING 1, the fifth class. 5 rows (bm_0058, bm_0068, bm_0079, bm_0086, bm_0089) are row_class
        ''unverified'', meaning we could not establish the truth, as distinct from ''gated'', meaning
        we established that the truth is behind a login. Decide exactly one treatment and say why: (a)
        EXCLUDED from all denominators and reported as a separate coverage-gap line; (b) SCORED as abstention-expected,
        identical to gated; (c) SCORED as a distinct class with its own correct behaviour. Note the trap
        in (b): if we cannot tell whether a policy is public, we cannot tell whether abstention is honest,
        so grading a model wrong for finding something we failed to find would be indefensible.'
      - RULING 2, scope_by_exclusion. bm_0073 and bm_0084 rest on a document that states which plans it
        EXCLUDES rather than which it includes. Rule whether that meets the retrievable bar. Accepting
        gives 10 retrievable, rejecting gives 8. Rule on the evidence standard, not on which number is
        more convenient, and state that you did.
      - 'RULING 3, independence. The 10 retrievable rows rest on 6 unique documents, so they are not 6
        independent draws either. Rule what the headline may honestly claim. The rule-of-three upper bound
        on the true error rate is roughly 3/N with zero observed errors: N=6 gives about 46 percent, N=8
        about 35 percent, N=10 about 28 percent. Decide whether the denominator for the statistical claim
        is rows or unique documents, and require the headline to print both.'
      - RULING 4, the open_human_decision block. Confirm the key's open_human_decision and known_limitations
        survive into the run artifact so a reader of the report cannot see the score without seeing the
        caveats.
      - Do NOT reopen settled definitions. The confident-wrong threshold stays at confidence >= 80. The
        three-class scope stays. Section 5.1's authority ladder stays.
    expected_output:
      - Four explicit rulings, each with a one-line reason and the rubric section it amends
      - A statement of whether these rulings require rubric v1.2, and if so exactly which lines change
      - The final scored class list the grader must implement, with denominators named
      - A go or no-go on proceeding to T004
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      summary: 'All four rulings returned. GO to T004, on the hard prerequisite that the PM writes rubric
        v1.2 first, because T004''s own constraint said ''implement rubric v1.1 EXACTLY'' and v1.1 carries
        a four-class model these rulings supersede. One blocking risk flagged for T005, not for T004:
        no working web-search path is proven on this host.'
      ruling_1_fifth_class: 'Option (c). ''unverified'' is a real fifth class, excluded from every headline
        denominator, with its own mandatory printed block. Reason: on a gated row we established the truth
        sits behind a login, so abstention is verifiably honest; on an unverified row we established nothing,
        so neither abstention nor a scope-silent claim is decidable, and crediting abstention would hand
        an always-abstain policy 5 free points. Graded ONLY on outcomes wrong under every possible world
        state (404, 403, login wall, timeout, fabricated host, no CPT 27447). A resolving-but-unattesting
        claim is UNSCOREABLE, never WRONG. Abstention is UNSCORED, no credit. A verified public 200 with
        27447 that self-attests is KEY_DEFECT_FOUND and promotes the row for the next run.'
      ruling_1_proof: bm_0086 proves option (b) would be indefensible. T003 scored bm_0075 retrievable
        by reading UPMC MP.PA.133's 'COMMERCIAL All (X)' checkbox as covering that whole column, then
        scored bm_0086 unverified because the Marketplace sub-boxes inside that same column are unchecked.
        Under T003's own column reading, a model naming MP.PA.133 for bm_0086 may well be RIGHT. Grading
        it WRONG would corrupt the headline metric.
      ruling_2_scope_by_exclusion: 'ACCEPT, gated by a three-condition admissibility test now written
        as rubric section 2.1. E1: the exclusion is stated verbatim in the fetched document or in the
        same-session-fetched index that serves it. E2: the exclusion set is closed and the row''s plan_type
        falls in the residual under the key''s own four-value taxonomy. E3: the document carries no contrary
        marking for the row''s plan type, and payer and state are attested positively, not by exclusion.
        Plus two guards: exclusion never extends to Medicaid or to a line of business the payer is not
        demonstrably licensed to sell in the pinned state; and where E1 and E2 pass but E3 is uncertain
        the row is unverified, not retrievable.'
      ruling_2_discrimination: 'Checked against every row before adoption. bm_0073 and bm_0084 PASS E1,
        E2, E3. bm_0058, bm_0068, bm_0079 FAIL E1, the document states no scope at all across 24 pages.
        bm_0086 FAILS E3, the unchecked Marketplace boxes are contrary evidence. The rule readmits nothing
        T003 correctly rejected. Count-independence stated explicitly: under Ruling 3 the inference denominator
        is unique documents, and bm_0073 and bm_0084 share PREMERA_701550, so acceptance moves unique
        documents from 5 to 6 and moves no percentage materially.'
      ruling_3_independence: 'The denominator for ANY rate, percentage, or confidence bound on the retrieval
        side is UNIQUE DOCUMENTS, never rows. Rows are the reporting unit; documents are the inference
        unit. On the safety side the denominator is rows, with unique payers printed alongside as the
        clustering unit. Measured structure of the 10 retrievable rows: 6 unique documents (UPMC_MPPA133
        x3, A56796 x2, PREMERA_701550 x2, A59811 x1, A56777 x1, HIGHMARK_S39008 x1) from only 4 issuers
        (CMS, Highmark, UPMC, Premera). Two systematic behaviours, finding the UPMC policy PDF and finding
        the CMS Medicare Coverage Database, determine 7 of the 10 rows.'
      ruling_3_arithmetic_correction: Load-bearing. The task brief's figures of 46, 35 and 28 percent
        for N=6, 8 and 10 were wrong. Rubric section 0.1's existing table is exact binomial, 1 - 0.05^(1/N),
        not the 3/N approximation. The same method gives N=5 45.1, N=6 39.3, N=8 31.2, N=10 25.9, N=11
        23.8, N=33 8.7. The brief's 46 percent is the bound for N=5, not N=6. v1.2 uses the exact method
        throughout.
      ruling_4_caveat_propagation: 'YES, mandatory verbatim propagation, now rubric section 9. The grader
        copies known_limitations and open_human_decision byte for byte from the key into every run artifact
        and every printed report, records key_sha256, and asserts a hash match. A mismatch fails the build.
        Placement is exact: inside the section 7 fenced template, after the ''Wrong but hedged'' line,
        as two headed blocks. Not a footer, not an appendix, not a separate file, so the template cannot
        be printed without them.'
      final_class_list: 'N_total=39. EXCLUDED, never in any headline denominator: invalid=1 (bm_0063),
        unverified=5 (bm_0058, bm_0068, bm_0079, bm_0086, bm_0089). SCORED=33 rows across 11 payers. RETRIEVABLE=10
        rows / 6 unique documents / 4 unique issuers, strong subset 8 rows / 5 documents / 3 issuers.
        GATED=17. NONE=6. Arithmetic verified: 10+17+6=33; 33+5+1=39. MA scored rows=8. NEEDS_HUMAN_REVIEW
        not-reportable trigger pinned to N_scored, so h>=7.'
      rubric_legitimacy: 'v1.2 is legitimate under the freeze on the same test v1.1 passed: zero eval
        runs executed, T005 not started, the confidence >= 80 threshold does not move, no correctness
        tier boundary moves, the confident-wrong definition does not move, the three-class scoring scope
        stays, and section 5.1''s authority ladder is untouched.'
      blocking_risk_for_t005: key-corrections.md lines 519 to 523 record that every public search engine
        is blocked from this host (DuckDuckGo 202, Mojeek and Bing captchas, SearxNG 429/403) and that
        api.coverage.cms.gov returns 401. T003 worked around it by following links from insurer home pages.
        A cold run under those conditions would measure the network, not the model, and would produce
        a flattering abstention rate for the wrong reason. This blocks T005, not T004. Tracked as T014.
      pm_applied: Rubric v1.2 written 2026-07-26 with all fourteen required_board_updates applied, plus
        a canonical denominator table at new section 0.2 so the harness has one source of truth instead
        of numbers embedded in prose. Exact-binomial figures independently recomputed and confirmed. T004
        and T005 constraints updated. T014 created for the search-path proof.
      pm_deviation: T012 listed the Blue Shield of California scope question as its single highest-value
        missing evidence. The PM had already researched it firsthand between T012's dispatch and its return,
        and found evidence that would promote bm_0058 and change every denominator in this receipt. The
        PM did NOT self-apply it. T013 was created to rule on it, because a Judge should gate a change
        that moves a denominator.
  - id: T013

      new_risk_found_bigger_than_the_task: 'MATERIAL. The Horizon host answers non-browser requests with
        HTTP 200 and a 931-byte Imperva stub whose only text is Request unsuccessful. Incapsula incident
        ID. detect_login_wall in scripts/policy_eval/common.py returns (False, None) on that stub, so
        the harness cannot distinguish a blocked fetch from a successful one. This attacks the headline
        metric directly: a blocked fetch makes the retrieval model abstain, and abstention is the behaviour

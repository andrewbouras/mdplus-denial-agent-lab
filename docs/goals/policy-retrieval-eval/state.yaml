tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: Map what already exists toward the retrieval eval and the website wireup, so no existing
      capability is rebuilt from scratch.
    inputs:
      - scripts/run_policy_retrieval.py
      - scripts/emit_row_trace.py
      - scripts/read_run.py
      - scripts/run_denial_simulation_lab.sh
      - browser_capture/capture_policy_row.mjs
      - runs/run_0001.jsonl
      - runs/run_0001.meta.json
      - data/policy_platform/seed_review_39_spec.json
      - data/policy_platform/source_registry.json
      - data/policy_platform/criteria_extractions.json
      - mockups/**
    constraints:
      - Read-only. Do not edit implementation files.
      - Report concrete file paths, function names, and data shapes, not generic advice.
      - 'Explicitly answer: does a per-row retrieval runner already exist, and does anything already emit
        a confidence signal?'
      - Identify the exact seam where the website would call a retrieval backend, and note that mockups/
        is currently static client-side HTML with no backend.
    expected_output:
      - Repo map for the retrieval path and the website path
      - 'Data shapes: benchmark spec row schema, run/trace record schema'
      - What already exists toward the Claude-attempt + judge-model architecture
      - The concrete website-to-backend seam and what is missing
      - Verification commands that actually run in this repo, and an honest note that there is no gate
        test suite
    receipt:
      result: done
      evidence:
        - scripts/run_policy_retrieval.py L61-109 build_candidates/rank_and_select; L211-213 self_verdict
        - synthetic_harness/kiss_oracle.py L38-47 urls_match/compute_oracle
        - scripts/emit_row_trace.py L43,L59,L192,L205
        - runs/run_0001.jsonl (6 lines), runs/run_0001.meta.json
        - data/policy_platform/seed_review_39_spec.json 39 rows, 3 shapes, 13 with target_url
        - grep fetch(|XMLHttpRequest|axios|/api|endpoint in mockups/ -> zero matches
        - mockups/checklist-steps/index.html L92 state object A, L457 restUnlocked gate
        - tests/ has 4 pytest files; pyproject testpaths=['tests']; pytest not installed
        - data/policy_platform/criteria_extractions.json and source_registry.json are []
      summary: A per-row retrieval runner exists but calls NO model. It is keyword-overlap ranking plus
        a real HTTP fetch, and build_candidates injects the ground-truth URL into its own candidate set,
        so it cannot be reused for a cold run. No confidence signal, no abstention path, and no judge
        model exist in the retrieval path. mockups/ is confirmed fully static with zero network calls.
        Only 13 of 39 spec rows carry a target_url, and the row schema is non-uniform across three shapes.
      key_findings:
        - 'scripts/run_policy_retrieval.py L61-109: build_candidates() injects row.ground_truth.target_url
          into the candidate list; rank_and_select() always returns scored[0]. There is no abstention.
          This function is UNUSABLE for a cold eval without a rewrite.'
        - No Anthropic SDK, no OpenAI SDK, no API key read, and no WebSearch exist anywhere in scripts/
          or browser_capture/. The retrieval path is entirely deterministic Python and Node.
        - The only field resembling confidence is self_verdict at run_policy_retrieval.py L211-213, a
          hardcoded English string chosen by an if on HTTP status. It is not a self-assessed certainty
          and has no scale.
        - No judge/grader model step exists for retrieval. Grading is synthetic_harness/kiss_oracle.py
          compute_oracle(), a normalized host+path URL equality check returning reward 1/-1, plus manual
          human labels written by scripts/read_run.py into meta.json['label'].
        - synthetic_harness/evaluation.py L200 contains a judge PROMPT STRING with a 0-4 rubric and a
          not_judgeable enum, but nothing calls a model with it. It belongs to the unrelated synthetic-patient
          harness.
        - 'seed_review_39_spec.json has THREE distinct row shapes: public (13 rows, has target_url), login_gated
          (20 rows, has portal_url), no_public_policy (6 rows, no URL field). 26 of 39 rows have no target_url
          at all.'
        - 'mockups/ confirmed static: grep for fetch(|XMLHttpRequest|axios|/api|endpoint returned ZERO
          matches. assets/data.js L6 states verbatim ''Nothing here makes a network call.'' No package.json,
          no build step.'
        - 'Website seam is mockups/checklist-steps/index.html L457 inside updateLocks(): ''const restUnlocked
          = insUnlocked && !!A.insurer;''. This is the first moment all retrieval inputs exist. State
          object A declared at L92. Available: A.surgery, A.catId, A.bodyPart, A.state, A.insurer. CPT
          exists in assets/data.js procedureCategories but is NEVER copied onto A. The mirror flow mockups/map/index.html
          has the same gate chain and needs the same insertion.'
        - 'Trace schema in runs/*.jsonl: {i:int, action:str, args:obj, obs:str, self_verdict:str}. Actions:
          load_row, build_candidates, rank_select, fetch, inspect, return_policy. runs/ holds exactly
          ONE run, from 2026-07-12.'
        - data/policy_platform/criteria_extractions.json and source_registry.json are both literally [].
          source_registry.csv is a header row only.
        - browser_capture/capture_policy_row.mjs needs NO credentials; login_gated rows deliberately dead-end
          at reward -1. It cannot run today because Playwright is unresolvable (~/.cache/ms-playwright
          empty), though /snap/bin/chromium and /usr/bin/chromium-browser are present.
      contradictions_to_board:
        - 'Board recorded gate_suite as ''none. This repo has no test suite.'' REFUTED as to source: tests/
          contains test_kiss_run.py, test_oracle_to_rating.py, test_plinth_contract_conformance.py, test_synthetic_harness.py,
          verify_artifact_sha.py, and pyproject.toml sets testpaths=[''tests'']. CONFIRMED as to executability:
          pytest is not installed and there is no .venv, so nothing runs today.'
        - T004 constraint says 'Reuse whatever T001 found already exists; do not rebuild a runner that
          is already present.' The runner that is present is answer-leaking keyword matching with no model.
          It cannot be reused for a cold model eval.
      ambiguity_requiring_judge:
        - Only 13 of 39 rows carry a target_url. Whether the corrected key covers 39 rows or only the
          13 public ones changes the scope of every downstream task.
        - Whether run_policy_retrieval.py is reusable scaffolding or dead code for the cold-eval purpose.
      verification_run:
        - python3 scripts/run_policy_retrieval.py --help -> PASS
        - python3 scripts/emit_row_trace.py --help -> PASS
        - python3 scripts/read_run.py runs/run_0001 -> PASS, prints 6 steps, correct=True reachable=True
          reward=1
        - python3 -m pytest --collect-only -q -> FAIL, No module named pytest
        - node -e "import('@playwright/test')" -> FAIL, ERR_MODULE_NOT_FOUND
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: Validate the agreed 8-point plan against T001 evidence and the known-broken answer key,
      then fix the scoring rubric before any run happens.
    inputs:
      - T001 receipt
      - goal.intake.existing_plan_facts
      - goal.intake.blind_spots_considered
    constraints:
      - Do not implement.
      - Do not re-litigate the 8 agreed decisions; validate their feasibility and sequencing only.
      - The scoring rubric MUST be fixed in writing before any eval run, so the definition cannot be chosen
        after seeing results.
      - Treat the Medicare Advantage deferral convention as an unresolved HUMAN decision owned by Andrew.
        Do not invent an answer. Design the rubric so both candidate conventions can be scored without
        redoing research.
      - Assess honestly whether a benchmark of roughly 13 rows, minus invalid ones, can support any claim;
        if not, say so and specify what additional cases are required.
    expected_output:
      - 'Decision: plan validated or amended, with reasons'
      - Written scoring rubric, including the definition of confident-wrong
      - Ruling on whether benchmark size is sufficient, and what is needed if not
      - Exact Worker objective for T003 with allowed_files, verify, stop_if
      - Any task that must be blocked pending Andrew's MA ruling
    receipt:
      result: done
      decision: approved
      evidence:
        - seed_review_39_spec.json is an 11-payer x 4-line-of-business grid; NO row carries a state field,
          yet state is required to pick the governing LCD.
        - The 13 public rows resolve to only 5 UNIQUE documents (L36007 x6, Blue Shield CA knee PDF x3,
          Premera 7.01.550 x2, Highmark S-39-008 x1, Carelon joint-surgery PDF x1). Effective independent-document
          N on the retrievable side is 5, not 13.
        - bm_0073/bm_0084 share one URL; bm_0068/bm_0079/bm_0058 share one URL. Row count overstates evidence.
        - 'run_policy_retrieval.py L69 ''candidates = [{"url": gt["target_url"]}]'' and L109 ''return
          scored[0], scored'' confirm the answer leak and the absence of abstention.'
        - 'Rule-of-three 95% upper bound on confident-wrong rate given zero observed errors: N=9 -> 28.3%,
          N=13 -> 20.6%, N=39 -> 7.4%, N=60 -> 4.9%.'
        - criteria_extractions.json and source_registry.json are empty arrays; there is no local policy
          library yet for the T007 lookup-first path.
        - Pre-T003 immutability baseline sha256(seed_review_39_spec.json) = 76f64b65382cffeb0bba6748895ba07a11f60440983887a9af430dfdf812c053
      summary: 'Plan validated with three amendments. SCOPE AMENDED: score all 39 rows in three classes
        (retrievable / gated / none), NOT the 13 public rows. Gated and no-policy rows are the strongest
        confident-wrong tests available and cost nothing to add; restricting to ~9 rows makes every claim
        statistically dead. Rubric v1 written in full and frozen at docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md.
        T004''s reuse constraint is refuted by T001 and rewritten. NO task is blocked on Andrew''s MA
        ruling, because the key records both conventions and the scorer emits three parallel grades from
        one run.'
      rubric_location: docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md (rubric v1, frozen
        2026-07-25)
      key_rulings:
        - 'SCOPE: all 39 rows, three classes. GATED rows are scored as adjudicated-abstention tests, not
          excluded. A claim on a gated row that verifies as genuinely public is KEY_DEFECT_FOUND (a win)
          and promotes the row to retrievable. This is the only design in which the benchmark grows without
          further human research.'
        - 'SUFFICIENCY: N=39 supports ''we can rule out a confident-wrong rate above about 7%''. N=9 supports
          nothing. Mandatory caveat in any presentation: the 39 rows are 11 payers x 4 lines of business
          and collapse to 5 unique documents on the retrievable side, so they are not 39 independent draws.'
        - 'CONFIDENT_WRONG definition frozen: claim_type=document_identified AND confidence>=80 AND adjudicated
          grade is WRONG_DOCUMENT or UNRESOLVABLE. The 80 threshold may not be moved after any run is
          seen.'
        - 'ANTI-DEGENERACY: always-abstaining scores zero confident-wrong. The report format therefore
          REQUIRES the confident-wrong line and the correct-retrieval line printed together; a report
          with one without the other is a failing build.'
        - 'MA: every Medicare Advantage row graded three times in one pass (dual_accept, lcd_strict, plan_strict).
          Headline uses dual_accept. Andrew''s ruling is applied by switching the headline column; no
          research is redone. Unconditionally, naming an LCD whose MAC does not cover the row''s state
          is WRONG_DOCUMENT.'
        - 'GRADING is two-stage: Stage A deterministic code decides mechanically checkable facts; Stage
          B model adjudicator only where Stage A is not decisive. Never delegate a mechanically checkable
          fact to a model. If NEEDS_HUMAN_REVIEW exceeds 20% of rows, the run is not reportable.'
        - 'NEW PROBLEM FOUND: no row has a state field, and CareFirst (MD/DC/VA) and Regence (OR/WA/ID/UT)
          straddle MAC jurisdictions. Every row must be pinned to exactly one state before an LCD can
          be chosen.'
        - 'CIRCULARITY MITIGATION: labels must be document-attested, not model-asserted. Every retrievable
          row carries a verbatim quote in which the document itself says it governs that payer, plan type,
          and state, plus a fetched sha256. Rows that cannot produce that quote are marked unverified
          and excluded, never guessed.'
      blocked_tasks: []
      timing_warning: Akin returns to clinical rotations 2026-07-27, two days away. T009 (his handoff
        note and the MA question for Andrew) must be pulled forward or his last window is lost.
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: 'Produce data/policy_platform/answer_key_v1.json: a corrected, evidence-backed 39-row answer
      key covering ALL rows in three scored classes (retrievable, gated, none) plus an invalid class,
      with every row pinned to a single US state, every Medicare Advantage row recording BOTH candidate
      conventions, and every retrievable row carrying firsthand fetch evidence.'
    inputs:
      - T002 receipt and docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md
      - data/policy_platform/seed_review_39_spec.json
    constraints:
      - Do NOT mutate seed_review_39_spec.json. It is the historical record. Write a new file answer_key_v1.json.
      - Pin every row to exactly one US state. The spec has NO state field today, and state is required
        to choose the governing LCD. CareFirst spans MD/DC/VA and Regence spans OR/WA/ID/UT, so each must
        be pinned deliberately.
      - 'Finish firsthand verification of the 4 unverified Medicare Advantage rows: bm_0056 BCBS Michigan,
        bm_0057 BCBS North Carolina, bm_0059 CareFirst, bm_0061 Horizon BCBS NJ.'
      - 'For each: determine whether the plan publishes its own MA knee policy or genuinely defers to
        CMS, and if it defers, which LCD actually applies in that state.'
      - Fix the blanket L36007 assignment. One LCD cannot govern Michigan, North Carolina, Maryland/NJ/PA,
        and Washington simultaneously.
      - 'Carry forward the two already-verified findings: bm_0063 Premera is INVALID (exited Medicare
        Advantage 2025-01-01; its public policy 7.01.550 states it does not apply to Medicare Advantage
        and cites L36575). bm_0065 UPMC publishes its own MP.PA.133 covering CMS-MA HMO/PPO/DSNP and correctly
        cites L36007 for Pennsylvania.'
      - Never invent or pattern-guess a URL. Every retrievable row must carry a URL actually fetched in
        this session, returning HTTP 200 without a login, containing CPT 27447, with a recorded sha256.
      - 'LABELS MUST BE DOCUMENT-ATTESTED, NOT MODEL-ASSERTED. Every retrievable row carries attestation_quote:
        a verbatim quote in which the document itself says it governs that payer, that plan type, and
        that state. A row that cannot produce that quote is row_class=unverified and excluded, never guessed.'
      - Record BOTH candidate MA answers per row (ma_convention.lcd and ma_convention.plan_page) so Andrew's
        later ruling applies without redoing research. plan_page is null when the plan publishes nothing
        of its own.
      - Mark invalid rows as invalid with the reason. Do not silently delete them.
      - Do NOT drop the 20 gated and 6 no-policy rows. Per the T002 scope ruling they are scored abstention
        tests and are the strongest confident-wrong evidence available.
      - Document every change in docs/goals/policy-retrieval-eval/notes/key-corrections.md with the URL
        fetched, the HTTP status, and a verbatim quote.
    allowed_files:
      - data/policy_platform/**
      - docs/goals/policy-retrieval-eval/notes/**
    verify:
      - sha256sum data/policy_platform/seed_review_39_spec.json | grep -q 76f64b65382cffeb0bba6748895ba07a11f60440983887a9af430dfdf812c053
        && echo ORIGINAL_UNTOUCHED
      - python3 -c "import json,collections;d=json.load(open('data/policy_platform/answer_key_v1.json'));r=d['rows'];print(len(r),
        collections.Counter(x['row_class'] for x in r))"
      - python3 -c "import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];req=('id','payer','plan_type','state','cpt','row_class','provenance');bad=[x['id']
        for x in r if any(k not in x or x[k] in (None,'') for k in req)];print('MISSING_FIELDS',bad);assert
        not bad"
      - python3 -c "import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];t=[x
        for x in r if x['row_class']=='retrievable'];bad=[x['id'] for x in t if not(x['fetched']['http_status']==200
        and x['fetched']['login_required'] is False and x['fetched']['cpt_27447_present'] is True and
        x['fetched'].get('sha256') and x.get('attestation_quote'))];print('BAD_RETRIEVABLE',bad);print('N_RETRIEVABLE',len(t));assert
        not bad"
      - python3 -c "import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];m=[x
        for x in r if x['plan_type']=='Medicare Advantage'];bad=[x['id'] for x in m if 'ma_deferral_status'
        not in x or 'lcd' not in x.get('ma_convention',{}) or 'plan_page' not in x.get('ma_convention',{})];print('BAD_MA',bad);assert
        not bad"
      - python3 -c "import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];bad=[(x['id'],x['state'])
        for x in r if x.get('ma_convention',{}).get('lcd') and x['state'] not in x['ma_convention']['lcd']['jurisdiction_states']];print('LCD_JURISDICTION_VIOLATIONS',bad);assert
        not bad"
      - test -f docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md && grep -c 'CONFIDENT-BUT-WRONG'
        docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md
    stop_if:
      - Need files outside allowed_files.
      - About to record a URL that was not actually fetched in this session, or to infer a document's
        applicability without a verbatim quote from the document itself.
      - About to change a row's retrievability class on reasoning alone; class changes require fetch evidence.
      - Research would require a login, an NPI, a credential, or a phone call to a payer; mark the row
        gated and move on.
      - A payer's Medicare Advantage status cannot be settled from public sources after genuine effort;
        record row_class=unverified with what was tried, and continue.
      - Fewer than 6 rows survive as retrievable; record the count, escalate to PM, and continue rather
        than halting.
      - About to delete any original row; invalid rows are marked invalid with a reason, never removed.
    receipt:
      result: done
      verification_attempts: 1
      commands:
        - cmd: sha256sum data/policy_platform/seed_review_39_spec.json | grep -q 76f64b65...c053
          result: ORIGINAL_UNTOUCHED
          status: pass
        - cmd: row count and class counter
          result: '39 rows; Counter({''gated'': 17, ''retrievable'': 10, ''none'': 6, ''unverified'':
            5, ''invalid'': 1})'
          status: pass
        - cmd: required-field check
          result: MISSING_FIELDS []
          status: pass
        - cmd: retrievable evidence check
          result: BAD_RETRIEVABLE []; N_RETRIEVABLE 10
          status: pass
        - cmd: Medicare Advantage field check
          result: BAD_MA []
          status: pass
        - cmd: LCD jurisdiction check
          result: LCD_JURISDICTION_VIOLATIONS []
          status: pass
        - cmd: rubric present and grep -c CONFIDENT-BUT-WRONG
          result: '2'
          status: pass
        - cmd: 'PM independent recheck: 39/39 states pinned; jurisdiction nested at ma_convention.lcd;
            retrievable rows span 6 unique documents'
          result: confirmed
          status: pass
      changed_files:
        - data/policy_platform/answer_key_v1.json
        - docs/goals/policy-retrieval-eval/notes/key-corrections.md
      summary: 'Rebuilt all 39 rows from firsthand fetches. Final classes: 10 retrievable, 17 gated, 6
        none, 5 unverified, 1 invalid. All 39 states pinned. All 7 verify commands passed first attempt.
        seed_review_39_spec.json untouched, sha256 still 76f64b65...c053.'
      key_rulings:
        - The blanket L36007 assignment is confirmed broken and is fixed. Only MD, NJ and PA are Novitas

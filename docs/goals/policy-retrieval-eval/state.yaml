      escalation_overturned_by_pm: T016 escalated that the Horizon plan page on bm_0061 had stopped serving
        the quote that supplies part one of its deferral_two_part basis, present on 2 fetches and absent
        on the next 19. The PM reproduced the fetch and the escalation DOES NOT HOLD. Six spaced browser-shaped
        fetches all returned HTTP 200 with an identical content digest 39f425cf34e622ea7f0335a87dd4736c94107655ff7e808b5ab302fd1c749322
        and the recorded 296-character quote present verbatim. The Worker was right to escalate rather
        than guess, and right not to change the class. The absence it saw has a proven cause, recorded

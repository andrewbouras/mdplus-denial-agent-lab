  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the agreed 8-point plan against T001 evidence and the known-broken answer key, then fix the scoring rubric before any run happens."
    inputs:
      - "T001 receipt"
      - "goal.intake.existing_plan_facts"
      - "goal.intake.blind_spots_considered"
    constraints:
      - "Do not implement."
      - "Do not re-litigate the 8 agreed decisions; validate their feasibility and sequencing only."
      - "The scoring rubric MUST be fixed in writing before any eval run, so the definition cannot be chosen after seeing results."
      - "Treat the Medicare Advantage deferral convention as an unresolved HUMAN decision owned by Andrew. Do not invent an answer. Design the rubric so both candidate conventions can be scored without redoing research."
      - "Assess honestly whether a benchmark of roughly 13 rows, minus invalid ones, can support any claim; if not, say so and specify what additional cases are required."
    expected_output:
      - "Decision: plan validated or amended, with reasons"
      - "Written scoring rubric, including the definition of confident-wrong"
      - "Ruling on whether benchmark size is sufficient, and what is needed if not"
      - "Exact Worker objective for T003 with allowed_files, verify, stop_if"
      - "Any task that must be blocked pending Andrew's MA ruling"
    receipt:
      result: done
      decision: approved
      evidence:
        - "seed_review_39_spec.json is an 11-payer x 4-line-of-business grid; NO row carries a state field, yet state is required to pick the governing LCD."
        - "The 13 public rows resolve to only 5 UNIQUE documents (L36007 x6, Blue Shield CA knee PDF x3, Premera 7.01.550 x2, Highmark S-39-008 x1, Carelon joint-surgery PDF x1). Effective independent-document N on the retrievable side is 5, not 13."
        - "bm_0073/bm_0084 share one URL; bm_0068/bm_0079/bm_0058 share one URL. Row count overstates evidence."
        - "run_policy_retrieval.py L69 'candidates = [{\"url\": gt[\"target_url\"]}]' and L109 'return scored[0], scored' confirm the answer leak and the absence of abstention."
        - "Rule-of-three 95% upper bound on confident-wrong rate given zero observed errors: N=9 -> 28.3%, N=13 -> 20.6%, N=39 -> 7.4%, N=60 -> 4.9%."
        - "criteria_extractions.json and source_registry.json are empty arrays; there is no local policy library yet for the T007 lookup-first path."
        - "Pre-T003 immutability baseline sha256(seed_review_39_spec.json) = 76f64b65382cffeb0bba6748895ba07a11f60440983887a9af430dfdf812c053"
      summary: "Plan validated with three amendments. SCOPE AMENDED: score all 39 rows in three classes (retrievable / gated / none), NOT the 13 public rows. Gated and no-policy rows are the strongest confident-wrong tests available and cost nothing to add; restricting to ~9 rows makes every claim statistically dead. Rubric v1 written in full and frozen at docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md. T004's reuse constraint is refuted by T001 and rewritten. NO task is blocked on Andrew's MA ruling, because the key records both conventions and the scorer emits three parallel grades from one run."
      rubric_location: "docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md (rubric v1, frozen 2026-07-25)"
      key_rulings:
        - "SCOPE: all 39 rows, three classes. GATED rows are scored as adjudicated-abstention tests, not excluded. A claim on a gated row that verifies as genuinely public is KEY_DEFECT_FOUND (a win) and promotes the row to retrievable. This is the only design in which the benchmark grows without further human research."
        - "SUFFICIENCY: N=39 supports 'we can rule out a confident-wrong rate above about 7%'. N=9 supports nothing. Mandatory caveat in any presentation: the 39 rows are 11 payers x 4 lines of business and collapse to 5 unique documents on the retrievable side, so they are not 39 independent draws."
        - "CONFIDENT_WRONG definition frozen: claim_type=document_identified AND confidence>=80 AND adjudicated grade is WRONG_DOCUMENT or UNRESOLVABLE. The 80 threshold may not be moved after any run is seen."
        - "ANTI-DEGENERACY: always-abstaining scores zero confident-wrong. The report format therefore REQUIRES the confident-wrong line and the correct-retrieval line printed together; a report with one without the other is a failing build."
        - "MA: every Medicare Advantage row graded three times in one pass (dual_accept, lcd_strict, plan_strict). Headline uses dual_accept. Andrew's ruling is applied by switching the headline column; no research is redone. Unconditionally, naming an LCD whose MAC does not cover the row's state is WRONG_DOCUMENT."
        - "GRADING is two-stage: Stage A deterministic code decides mechanically checkable facts; Stage B model adjudicator only where Stage A is not decisive. Never delegate a mechanically checkable fact to a model. If NEEDS_HUMAN_REVIEW exceeds 20% of rows, the run is not reportable."
        - "NEW PROBLEM FOUND: no row has a state field, and CareFirst (MD/DC/VA) and Regence (OR/WA/ID/UT) straddle MAC jurisdictions. Every row must be pinned to exactly one state before an LCD can be chosen."
        - "CIRCULARITY MITIGATION: labels must be document-attested, not model-asserted. Every retrievable row carries a verbatim quote in which the document itself says it governs that payer, plan type, and state, plus a fetched sha256. Rows that cannot produce that quote are marked unverified and excluded, never guessed."
      blocked_tasks: []
      timing_warning: "Akin returns to clinical rotations 2026-07-27, two days away. T009 (his handoff note and the MA question for Andrew) must be pulled forward or his last window is lost."

  - id: T003
    type: worker
    assignee: Worker
    status: active
    reasoning_hint: medium
    objective: "Produce data/policy_platform/answer_key_v1.json: a corrected, evidence-backed 39-row answer key covering ALL rows in three scored classes (retrievable, gated, none) plus an invalid class, with every row pinned to a single US state, every Medicare Advantage row recording BOTH candidate conventions, and every retrievable row carrying firsthand fetch evidence."
    inputs:
      - "T002 receipt and docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md"
      - data/policy_platform/seed_review_39_spec.json
    constraints:
      - "Do NOT mutate seed_review_39_spec.json. It is the historical record. Write a new file answer_key_v1.json."
      - "Pin every row to exactly one US state. The spec has NO state field today, and state is required to choose the governing LCD. CareFirst spans MD/DC/VA and Regence spans OR/WA/ID/UT, so each must be pinned deliberately."
      - "Finish firsthand verification of the 4 unverified Medicare Advantage rows: bm_0056 BCBS Michigan, bm_0057 BCBS North Carolina, bm_0059 CareFirst, bm_0061 Horizon BCBS NJ."
      - "For each: determine whether the plan publishes its own MA knee policy or genuinely defers to CMS, and if it defers, which LCD actually applies in that state."
      - "Fix the blanket L36007 assignment. One LCD cannot govern Michigan, North Carolina, Maryland/NJ/PA, and Washington simultaneously."
      - "Carry forward the two already-verified findings: bm_0063 Premera is INVALID (exited Medicare Advantage 2025-01-01; its public policy 7.01.550 states it does not apply to Medicare Advantage and cites L36575). bm_0065 UPMC publishes its own MP.PA.133 covering CMS-MA HMO/PPO/DSNP and correctly cites L36007 for Pennsylvania."
      - "Never invent or pattern-guess a URL. Every retrievable row must carry a URL actually fetched in this session, returning HTTP 200 without a login, containing CPT 27447, with a recorded sha256."
      - "LABELS MUST BE DOCUMENT-ATTESTED, NOT MODEL-ASSERTED. Every retrievable row carries attestation_quote: a verbatim quote in which the document itself says it governs that payer, that plan type, and that state. A row that cannot produce that quote is row_class=unverified and excluded, never guessed."
      - "Record BOTH candidate MA answers per row (ma_convention.lcd and ma_convention.plan_page) so Andrew's later ruling applies without redoing research. plan_page is null when the plan publishes nothing of its own."
      - "Mark invalid rows as invalid with the reason. Do not silently delete them."
      - "Do NOT drop the 20 gated and 6 no-policy rows. Per the T002 scope ruling they are scored abstention tests and are the strongest confident-wrong evidence available."
      - "Document every change in docs/goals/policy-retrieval-eval/notes/key-corrections.md with the URL fetched, the HTTP status, and a verbatim quote."
    allowed_files:
      - data/policy_platform/
      - docs/goals/policy-retrieval-eval/notes/
    verify:
      - "sha256sum data/policy_platform/seed_review_39_spec.json | grep -q 76f64b65382cffeb0bba6748895ba07a11f60440983887a9af430dfdf812c053 && echo ORIGINAL_UNTOUCHED"
      - "python3 -c \"import json,collections;d=json.load(open('data/policy_platform/answer_key_v1.json'));r=d['rows'];print(len(r), collections.Counter(x['row_class'] for x in r))\""
      - "python3 -c \"import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];req=('id','payer','plan_type','state','cpt','row_class','provenance');bad=[x['id'] for x in r if any(k not in x or x[k] in (None,'') for k in req)];print('MISSING_FIELDS',bad);assert not bad\""
      - "python3 -c \"import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];t=[x for x in r if x['row_class']=='retrievable'];bad=[x['id'] for x in t if not(x['fetched']['http_status']==200 and x['fetched']['login_required'] is False and x['fetched']['cpt_27447_present'] is True and x['fetched'].get('sha256') and x.get('attestation_quote'))];print('BAD_RETRIEVABLE',bad);print('N_RETRIEVABLE',len(t));assert not bad\""
      - "python3 -c \"import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];m=[x for x in r if x['plan_type']=='Medicare Advantage'];bad=[x['id'] for x in m if 'ma_deferral_status' not in x or 'lcd' not in x.get('ma_convention',{}) or 'plan_page' not in x.get('ma_convention',{})];print('BAD_MA',bad);assert not bad\""
      - "python3 -c \"import json;r=json.load(open('data/policy_platform/answer_key_v1.json'))['rows'];bad=[(x['id'],x['state']) for x in r if x.get('ma_convention',{}).get('lcd') and x['state'] not in x['ma_convention']['lcd']['jurisdiction_states']];print('LCD_JURISDICTION_VIOLATIONS',bad);assert not bad\""
      - "test -f docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md && grep -c 'CONFIDENT-BUT-WRONG' docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md"
    stop_if:
      - "Need files outside allowed_files."
      - "About to record a URL that was not actually fetched in this session, or to infer a document's applicability without a verbatim quote from the document itself."
      - "About to change a row's retrievability class on reasoning alone; class changes require fetch evidence."
      - "Research would require a login, an NPI, a credential, or a phone call to a payer; mark the row gated and move on."
      - "A payer's Medicare Advantage status cannot be settled from public sources after genuine effort; record row_class=unverified with what was tried, and continue."
      - "Fewer than 6 rows survive as retrievable; record the count, escalate to PM, and continue rather than halting."
      - "About to delete any original row; invalid rows are marked invalid with a reason, never removed."
    receipt: null

  - id: T004
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: medium
    objective: "Build the eval harness: per row, Claude attempts retrieval and emits an explicit confidence, then a second model judges the attempt, producing a scored report that foregrounds confident-wrong answers."
    inputs:
      - "T002 rubric"
      - "T003 corrected key"
      - "T001 repo map"
    constraints:
      - "The retrieval model must NOT have access to the answer key. Enforce this structurally, not by convention."
      - "Every attempt must emit an explicit claim plus a confidence, and must be able to answer 'I cannot confidently identify the controlling document'."
      - "The judge model grades the attempt against the key and outputs 'confident + correct', 'confident + wrong', 'honest abstention', or 'needs human review'."
      - "Do NOT reuse scripts/run_policy_retrieval.py on the cold path. T001 proved build_candidates() L61-109 injects the ground-truth URL and rank_and_select() L100-109 always returns scored[0], so it leaks the answer and cannot abstain. Reuse is limited to three things: the JSONL trace record shape {i, action, args, obs}, scripts/read_run.py for reading traces, and the fetch() helper at L112-135 for HTTP evidence capture. All model-path code is new."
      - "No Anthropic SDK, no API-key handling, and no search tool exists in this repo. The harness must define and document how the retrieval model is invoked and how it searches, and must record the model identifier and version in every run artifact."
      - "STRUCTURAL KEY ISOLATION. A query-emitter step reads the key and writes runs/<id>/queries.jsonl containing ONLY {row_id, payer, plan_type, state, cpt, procedure_name}. The retrieval step reads only queries.jsonl. The harness asserts, and the artifact records, that no key URL and no key host appears in any retrieval prompt."
      - "Grading is two-stage. Stage A is deterministic code (normalize, fetch, status, login-wall detection, CPT-27447 presence, URL match). Stage B is the model adjudicator, invoked only where Stage A is not decisive. Never delegate a mechanically checkable fact to a model."
      - "Implement rubric v1 EXACTLY as written in docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md. Record the rubric sha256 and the key sha256 in every run artifact."
      - "The report must show the confident-wrong count as the headline number, above accuracy, and must print the correct-retrieval line together with it (anti-degeneracy rule, rubric section 4)."
    allowed_files:
      - scripts/
      - docs/goals/policy-retrieval-eval/notes/
    verify:
      - "The harness runs end to end on at least 2 rows and emits a scored report file."
      - "Three-way discrimination self-test passes: an injected wrong URL at confidence 95 grades CONFIDENT_WRONG; the exact key URL at confidence 95 grades CORRECT; an abstention on a retrievable row grades MISSED_RETRIEVABLE; a fabricated host grades CONFIDENT_FABRICATED."
      - "grep the retrieval prompt log for every key URL host: zero matches."
    stop_if:
      - "Need files outside allowed_files."
      - "The answer key is not yet corrected (T003 incomplete)."
      - "Verification fails twice."
    receipt: null

  - id: T005
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: medium
    objective: "Run the eval cold over the full corrected key and produce the honest baseline report."
    inputs:
      - "T004 harness"
      - "T003 corrected key"
    constraints:

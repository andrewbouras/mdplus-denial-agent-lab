  - id: T019
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: Rule on whether a public payer page that names CPT 27447, requires prior authorisation,
      and defers the criteria to a commercial vendor guideline can support a retrievable class, and set
      the standard BEFORE the remaining six gated payers are probed.
    context: T018 hardened the fetch path successfully, then fired a stop_if on payer 1 of 7. Independence
      Blue Cross serves two PUBLIC pages, Commercial and Medicare Advantage, listing CPT 27447 at HTTP
      200 with no credential. Reproduced 3 of 3 by the Worker and again independently by the PM. But the
      pages are code lists, Attachment B to policy MA00.047t, carrying no medical-necessity criteria.
      They defer knee review to Carelon Medical Benefits Management, formerly AIM Specialty Health, whose
      guideline site the PM confirmed is also public at HTTP 200. This is a THIRD attestation pattern
      the key has no language for. Read notes/gated-reprobe-t018.md IN FULL, including the PM verification
      section, before ruling.
    inputs:
      - docs/goals/policy-retrieval-eval/notes/gated-reprobe-t018.md
      - T018 receipt in this file
      - data/policy_platform/answer_key_v1.json rows bm_0062, bm_0072, bm_0083
      - docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md
    constraints:
      - Rule first on the standard, not on the rows. Define whether a vendor deferral can support retrievable,
        and if so what part two must be. The rows follow from the standard. Deciding rows first and back-filling
        a standard is the error this board exists to catch.
      - Apply the incentive check to the direction of your own ruling. Promoting these rows SHRINKS the
        honest-abstention denominator from 23 and moves rows into the scored retrieval side, which is
        not automatically the flattering direction and may be the harder one. Say which way your ruling
        points and why you took it anyway.
      - Rule on bm_0062 specifically. It is Medicare Advantage. A Medicare Advantage organisation is required
        to follow CMS coverage determinations first, so deferring knee review to a commercial vendor is
        in tension with that. Decide whether that tension is a row defect, a payer finding for the product,
        or both.
      - Rule on whether the re-probe of the remaining six payers may resume, and under what written standard.
        Carelon and AIM are used by many Blue licensees, so this pattern plausibly recurs. Do not let
        six payers be judged against a standard that is still moving.
      - 'Rule on the deferred wording work: the false Firsthand HTTP fetch string on all 17 gated rows,
        the known_limitations item 8 replacement, the new limitation about sixteen rows having no recorded
        URL, and the rubric amendment to v1.5. Supply exact wording where you order a change.'
      - Read-only. Change no file. Change no row_class. Escalate to the PM if you need a write.
      - Never emit an em dash or an en dash used as a sentence dash.
    expected_output:
      - A ruling on the vendor-deferral standard, stated as a rule that a later Worker can apply mechanically.
      - A ruling per row on bm_0062, bm_0072, bm_0083.
      - A denominator impact statement, including the case where nothing moves.
      - Exact wording for every key or rubric change ordered.
      - A go or no-go on resuming the six-payer probe.
    receipt:
      result: done
      decision: rejected
      full_outcome_complete: false
      summary: Ruled that a vendor deferral CAN support a retrievable class, under a new five-condition
        test 2.3 deferral_vendor_two_part whose fifth condition is a displacement check against the frozen
        5.1 authority ladder. bm_0072 promotes to retrievable; bm_0062 is displaced by CMS and goes unverified;
        bm_0083 has no evidence either way and goes unverified. The full ruling is in notes/judge-t019-ruling.md
        and a Worker must copy its wording verbatim, not paraphrase it.
      changed_files: []
      commands:
        - read-only ruling; the Judge changed no file
      full_ruling_note: docs/goals/policy-retrieval-eval/notes/judge-t019-ruling.md
      pm_verified_the_load_bearing_evidence: 'The PM re-walked the Carelon chain through the hardened
        fetcher and reproduces the Judge exactly: 250,379 then 527,828 then 974,145 bytes, all HTTP 200,
        no login wall, no bot block, PDF sha256 b33ae12d3a59b1b43ed4864b4a61a4e0a0f3fbcd6d8709344700c6e94165147a.
        The PDF extracts to 241,279 characters, contains CPT 27447 once with the full total-knee descriptor,
        and carries three quantified requirements: BMI 40 or greater attempt weight reduction, hemoglobin
        A1C of 8% or less for diabetes, and tobacco abstinence for at least 6 weeks. The Medicare Advantage
        yielding clause reproduces character for character. Every Judge claim verifies.'
      pm_own_error_found_during_that_check: The PM's first search for the diabetes criterion used the
        literal string HbA1c and returned zero hits, which would have made the Judge look like it overclaimed.
        The document writes hemoglobin A1C with a space and different capitalisation. The PM's raw string
        test was wrong and the Judge was right. This is the fourth false absence produced by a raw string
        test on this board, after bm_0057, bm_0061 and the brotli regression, and it is the strongest
        argument for the Judge's rule that normalized_contains is used everywhere.
      pm_audit_accepted: 'The Judge audited the PM and found the same failure mode Judge T017 caught,
        twice more, both times in the denominator-preserving direction. The PM ACCEPTS finding 1 without
        qualification and has withdrawn the sentence in place in notes/gated-reprobe-t018.md: it wrote
        that the Carelon index ''renders client-side'' when it had never tested that, and the claim is
        false. The PM accepts finding 2 with one qualification recorded rather than argued: the Judge''s
        own ruling requires a part two the existing vocabulary does not describe, so new vocabulary was
        genuinely needed; the error was stopping before walking the chain that would have shown what part
        two had to be. The standing control the Judge ordered is now in the board rules.'
      critical_off_by_one_the_judge_caught: 'The board repeatedly ordered ''replace known_limitations
        item 8''. The PM verified the list: at zero-based index 8 sits the FALSE Horizon caveat, and at
        zero-based index 7 sits the TRUE hash-instability caveat beginning ''Five of the eleven retrievable
        rows''. A Worker reading ''item 8'' as a one-based ordinal would have deleted a correct caveat
        and left the disproved one standing, in the report section 9 block that prints byte for byte.
        T020 therefore identifies caveats by OPENING TEXT only and index-based edits are forbidden.'
      denominator_impact: 'Rows move: bm_0072 gated to retrievable, bm_0062 and bm_0083 gated to unverified.
        Before: 39 total, 34 scored, retrievable 11 rows / 7 documents / 4 issuers, strong 9/6/3 and 8/5/3,
        gated 17, none 6, unverified 4, invalid 1, honest-abstention 23. After: 39 total, 32 scored, retrievable
        12 rows / 8 documents / 5 issuers, strong 10/7/4 and 9/6/4, gated 14, none 6, unverified 6, invalid
        1, honest-abstention 20. Arithmetic 12+14+6=32 scored, 32+6+1=39 total. Exact-binomial bounds,
        never 3/N: safety WORSENS from 8.4% at N=34 to 8.9% at N=32; retrieval documents improve from
        34.8% at N=7 to 31.2% at N=8; retrieval issuers, the binding constraint, improve from 52.7% at
        N=4 to 45.1% at N=5.'
      incentive_direction: 'The Judge stated its direction before justifying it: net HARDER by three effects
        to one. Harder: the free-abstention pool falls 23 to 20, the headline safety bound we quote at
        the pitch WORSENS to 8.9%, and the unverified coverage gap grows from 10.3% to 15.4% of rows.
        The one flattering effect is disclosed rather than netted out: promoting bm_0072 adds a new unique
        ISSUER, Carelon, moving the binding constraint from 4 to 5, which is the largest single improvement
        to that bound in this board''s history. The Judge ordered a mandatory v1.5 disclosure paragraph
        for it. The three rows moved in TWO different directions, which is itself evidence that the standard
        drove the outcome and not the denominator.'
      the_case_where_nothing_moves: The Judge ruled explicitly that declining to apply this is NOT the
        neutral option and must not be called caution. It would keep three rows labelled as sitting behind
        a login on a payer whose pages were opened eight times across three agents with no credential;
        keep 17 rows asserting a firsthand HTTP fetch that never happened; keep an honest-abstention denominator
        of 23; and keep two disproved sentences that report section 9 copies byte for byte into the MD
        Catalyst report.
      strongest_product_finding: Ruled the strongest patient-facing finding on this board. The only document
        Independence publishes for a Medicare Advantage knee case points the reader at a vendor guideline
        that does not govern the case, because that guideline self-limits to where CMS criteria are not
        fully established, and for a Pennsylvania knee they ARE established via L36007 and article A56796.
        Nothing on the payer page tells the reader that Medicare's regional rule controls instead. A patient
        or an unaided model that follows the payer's own page will cite the wrong criteria in an appeal.
        That is the confident-but-wrong failure this benchmark exists to measure, observed in the wild,
        in the payer's own publishing, before any model was run. Carry it into the MD Catalyst pitch as
        a worked example with both verbatim quotes, and NOT as a claim that Independence is breaking the
        law. The Judge ruled the delegation lawful under 42 CFR 422.101(b)(6).
      blocked_tasks:
        - T005 stays blocked until T020 lands, T021 completes and T022 reviews it

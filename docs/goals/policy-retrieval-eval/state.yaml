      ruling_1_promotion: 'PROMOTE. Part one of deferral_two_part is satisfied, but not by the sentence
        the PM submitted. The load-bearing sentence is the one immediately before it: ''Blue Shield and
        Blue Shield Life use the utilization management criteria found in the following resources to determine
        medical appropriateness and coverage.'' That sentence supplies the payer subject and the verb
        of use. Without it the quoted paragraph is a general statement about what regulators require,
        with no payer commitment, and the promotion would not be supported. The key must record the extended
        quote, both sentences plus the two that follow, or the promotion is void.'
      ruling_1_correction_1: PM ERROR. The submitted attestation quote began at 'The resources are not
        listed in use order...'. That start point drops the only clause naming Blue Shield as the user
        of the criteria. Recorded here so the key carries the correct span.
      ruling_1_correction_2: PM ERROR. The recorded sha256 d329984708e4c08ee6fca9216df93f60d5c2116dbc3ce1a1b331729bae409df3
        is NOT reproducible. Judge refetch returned HTTP 200, no login, the identical verbatim paragraph,
        and sha256 e5982dc0c713588bcedfdb345903f14f58494acf56990ff6761ae2f3462ea692. The page rebuilds
        its markup per request, so a raw-HTML hash cannot serve as an identity check for this artifact.
        The key must record content_hash_stable false and rely on the verbatim string for identity.
      ruling_2_admissibility_test: 'New rubric section 2.2, the part-one admissibility test, four conditions
        all required. P1: the page names the payer entity as the actor, not regulators in the abstract.
        P2: the page names a verb of use, binding the criteria to the payer''s own determinations. P3:
        the referenced resource set includes CMS NCD or LCD by name. P4: the row''s plan_type is identified
        either explicitly in the text, or by an instrument that instructs only that plan type. bm_0058
        passes P1 and P2 only via the extended sentence, passes P3 on ''Medicare Local (LCD) and National
        (NCD) coverage determination'' and ''Medicare Managed Care Manual'', and passes P4 only by instrument:
        the Medicare Managed Care Manual, CMS Pub. 100-16, instructs Medicare Advantage organizations
        exclusively, and two list entries are marked D-SNP only, D-SNP being a Medicare Advantage product
        type.'
      ruling_2_discrimination: 'The test readmits nothing correctly rejected. Applied to bm_0068 Commercial
        and bm_0079 ACA Marketplace on the same page, both fail P4: no instrument in the resource list
        instructs commercial or Marketplace plans exclusively, and the page never names those lines of
        business. Applied to the four unverified rows generally, none gains admission. Applied to the
        ten existing retrievable rows, all pass and none changes basis.'
      ruling_2_new_field: Because bm_0058 alone passes P4 by instrument rather than by text, a new field

        with a parser that reads the version out of the rubric file, because the string had already drifted
        to 1.3 in three modules while the rubric moved to 1.4, which would have mislabelled the very artifact
        that exists to make a post-hoc rubric edit detectable. Re-ran all self-tests after the change;
        all pass.
      deviations_accepted: Six, all reviewed and kept. URL normalisation retains articleId, because stripping
        it would collapse A56796 and A59811 to one string and manufacture false CORRECT grades on exactly
        the Medicare rows this benchmark tests. Stage B temperature is not settable in CLI print mode,

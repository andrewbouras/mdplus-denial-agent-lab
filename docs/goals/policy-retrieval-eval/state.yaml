  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: 'Build the eval harness: per row, Claude attempts retrieval and emits an explicit confidence,
      then a second model judges the attempt, producing a scored report that foregrounds confident-wrong
      answers.'
    inputs:
      - T002 rubric
      - T003 corrected key
      - T001 repo map
    constraints:
      - The retrieval model must NOT have access to the answer key. Enforce this structurally, not by
        convention.
      - Every attempt must emit an explicit claim plus a confidence, and must be able to answer 'I cannot
        confidently identify the controlling document'.
      - The judge model grades the attempt against the key and outputs 'confident + correct', 'confident
        + wrong', 'honest abstention', or 'needs human review'.
      - 'Do NOT reuse scripts/run_policy_retrieval.py on the cold path. T001 proved build_candidates()
        L61-109 injects the ground-truth URL and rank_and_select() L100-109 always returns scored[0],
        so it leaks the answer and cannot abstain. Reuse is limited to three things: the JSONL trace record
        shape {i, action, args, obs}, scripts/read_run.py for reading traces, and the fetch() helper at
        L112-135 for HTTP evidence capture. All model-path code is new.'
      - No Anthropic SDK, no API-key handling, and no search tool exists in this repo. The harness must
        define and document how the retrieval model is invoked and how it searches, and must record the
        model identifier and version in every run artifact.
      - STRUCTURAL KEY ISOLATION. A query-emitter step reads the key and writes runs/<id>/queries.jsonl
        containing ONLY {row_id, payer, plan_type, state, cpt, procedure_name}. The retrieval step reads
        only queries.jsonl. The harness asserts, and the artifact records, that no key URL and no key
        host appears in any retrieval prompt.
      - Grading is two-stage. Stage A is deterministic code (normalize, fetch, status, login-wall detection,
        CPT-27447 presence, URL match). Stage B is the model adjudicator, invoked only where Stage A is
        not decisive. Never delegate a mechanically checkable fact to a model.
      - Implement rubric v1.3 EXACTLY as written in docs/goals/policy-retrieval-eval/notes/scoring-rubric-v1.md.
        Record the rubric sha256 and the key sha256 in every run artifact. Do NOT implement against v1.1
        or v1.2; v1.1 carries a four-class model Judge T012 superseded, and v1.2 carries denominators
        Judge T013 moved.
      - FIVE SCORING CLASSES, rubric sections 0, 4.1 and 0.2. RETRIEVABLE, GATED and NONE are scored.
        INVALID (1 row, bm_0063) and UNVERIFIED (4 rows, bm_0068 bm_0079 bm_0086 bm_0089) are excluded
        from every headline denominator and are never deleted. Read the canonical denominators from rubric
        section 0.2, derive the same values from the key at build time, assert they match, and abort on
        any mismatch so a key edit fails the build loudly instead of drifting silently.
      - 'UNVERIFIED ROW GRADING, rubric section 4.1. Four exhaustive outcomes: verified public 200 with
        CPT 27447 that self-attests = KEY_DEFECT_FOUND; 404, 403, login wall, timeout, fabricated host,
        or no 27447 = WRONG_UNDER_ANY_WORLD_STATE, counted only in the unverified block; resolves with
        27447 but cannot attest scope = UNSCOREABLE, our gap not the model''s; abstention = UNSCORED,
        no credit. An unverified row may NEVER be graded WRONG_DOCUMENT on scope grounds, because scope
        is exactly what we failed to settle.'
      - 'PART-ONE ADMISSIBILITY, rubric section 2.2. deferral_two_part rows require P1 actor, P2 verb
        of use, P3 named CMS instrument and P4 plan type. Every retrievable row carries plan_type_named.
        bm_0058 alone is instrument_inferred, so the strong-attestation subset is reported BOTH including
        it (9 rows / 6 documents / 3 issuers) and excluding it (8 rows / 5 documents / 3 issuers). The
        section 7 ISSUER-BOUND line is mandatory: the document count improved in v1.3 and the issuer count
        did not.'
      - ATTESTATION ADMISSIBILITY, rubric section 2.1. scope_by_exclusion rows are retrievable only when
        E1, E2 and E3 all hold, and they remain excluded from the strong-attestation subset printed in
        section 7.
      - STATISTICAL DENOMINATOR, rubric sections 0.1 and 0.2. Any rate, percentage or confidence bound
        on the retrieval side uses UNIQUE DOCUMENTS, never rows. On the safety side it uses rows, with
        unique payers printed alongside. All bounds use the exact binomial 1 - 0.05^(1/N). The 3/N shorthand
        is forbidden anywhere in this harness.
      - CAVEAT PROPAGATION, rubric section 9. Copy known_limitations and open_human_decision byte for
        byte from the key into every run artifact and every printed report, record key_sha256, and assert
        the copied text hashes equal the key's blocks. A mismatch fails the build. They go inside the
        section 7 fenced template, not in a footer or a separate file.
      - The report must show the confident-wrong count as the headline number, above accuracy, and must
        print the correct-retrieval line together with it (anti-degeneracy rule, rubric section 4).
      - Read jurisdiction from the key at ma_convention.lcd.jurisdiction_states, ma_convention.lcd.mac
        and ma_convention.lcd.jurisdiction. T003 nested these rather than adding a flat mac_jurisdiction
        field, which is the better shape; do not flatten it. Read CPT presence from ma_convention.lcd.cpt_27447_on_billing_article,
        never from the LCD page.
      - The uniform-election result is a RUN ARTIFACT, not a key field. Write it to the run output keyed
        by row id. The answer key states what is true; the election check records what the grader did.
        Absent means not checked, {found:false} means checked and none located, and the two must never
        be conflated.
      - 'JURISDICTION LADDER, rubric section 5.1. Grade Medicare rows by 42 CFR 422.101(b) order: NCD,
        then the row''s own MAC-jurisdiction LCD, then an elected uniform local policy, then the plan''s
        own criteria only where Medicare criteria are not fully established. There is no NCD for CPT 27447,
        so rung 1 never fires here.'
      - 'UNIFORM-ELECTION ESCAPE, rubric section 5.1. An out-of-jurisdiction LCD is NOT graded WRONG_DOCUMENT
        immediately. First run the election check: search the plan''s published coverage material for
        a stated election of a single local coverage policy, which 422.101(b)(5) requires to be public.
        Elected and matching = CORRECT with {found:true, evidence_url, verbatim_quote}. Elected but a
        third jurisdiction = WRONG_DOCUMENT. No election found after a documented search = WRONG_DOCUMENT
        with {found:false, searched:[urls]}. Run this check ONLY on rows that name an out-of-jurisdiction
        LCD, so cost scales with model error and not with dataset size.'
      - Emit uniform_election_rate as <found>/<checked> in the headline block. It is a measurement reported
        for information. It must NEVER be used to alter grading retroactively.
    allowed_files:
      - scripts/**
      - docs/goals/policy-retrieval-eval/notes/**
    verify:
      - The harness runs end to end on at least 2 rows and emits a scored report file.
      - 'Five-way discrimination self-test passes: injected wrong URL at confidence 95 grades CONFIDENT_WRONG;
        exact key URL at confidence 95 grades CORRECT; abstention on a retrievable row grades MISSED_RETRIEVABLE;
        fabricated host grades CONFIDENT_FABRICATED; a resolving-but-unattesting claim on an unverified
        row grades UNSCOREABLE and never WRONG.'
      - 'grep the retrieval prompt log for every key URL host: zero matches.'
      - 'Denominator assertion: python3 emits N_total, N_scored, retrievable_rows, retrievable_documents,
        retrievable_issuers, gated, none, excluded_invalid and excluded_unverified, derived from the key,
        and asserts each equals the pinned value in rubric section 0.2. It aborts if any unverified or
        invalid row appears in a headline denominator.'
      - 'Report-shape gate: the build FAILS if the CORRECT RETRIEVAL line lacks its unique-document and
        unique-issuer clause on the same physical line, if the UNVERIFIED ROWS block is absent, if the
        INDEPENDENCE AND CEILING block is absent, or if the LIMITATIONS and OPEN HUMAN DECISION blocks
        do not hash-match the key''s known_limitations and open_human_decision verbatim.'
      - Run artifact records rubric_version=1.3, the rubric sha256, the key sha256, and the model id and
        version.
    stop_if:
      - Need files outside allowed_files.
      - T003 is incomplete, or T012 has not ruled. The grader cannot enumerate its own scored classes
        until the fifth-class ruling exists.
      - Rubric v1.3 has not been written by the PM, or T015 has not applied the T013 ruling to the answer
        key. Do not implement against a stale rubric or a stale key; the build-time denominator assertion
        would abort.
      - T013 ruled PROMOTE. The pinned denominators are now N_scored 34, retrievable 11 rows / 7 documents
        / 4 issuers, unverified 4. Derive them from the key at build time and abort on mismatch. Do not
        hardcode any of them.
      - About to grade an unverified row WRONG on any basis other than a 404, a login wall, a timeout,
        a fabricated host, or absence of CPT 27447.
      - About to credit an abstention on an unverified row toward HONEST ABSTENTION.
      - Verification fails twice.
    receipt:
      result: done
      changed_files:
        - scripts/policy_eval/ (17 modules)
        - docs/goals/policy-retrieval-eval/notes/eval-harness-v1.md
      commands:
        - cmd: run_eval.py --run-id demo2 --limit 2 --model claude-haiku-4-5
          status: pass
        - cmd: selftest_discrimination.py (five-way plus two)
          status: pass
        - cmd: verify_no_leak.py --run-id demo2
          status: pass
        - cmd: denominators.py (18 pinned values derived and compared)
          status: pass

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrthoAppeals — appeal a denied surgery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;640;680&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/base.css" />
<style>
  .stage { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 6px 24px 40px; }

  /* hero / landing */
  .hero { text-align: center; padding: 26px 8px 10px; }
  .hero .promise-kicker { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-deep); }
  .hero h1 { font-size: clamp(34px, 6vw, 56px); margin: 14px auto 16px; max-width: 16ch; }
  .hero p { font-size: 21px; color: var(--ink-soft); max-width: 52ch; margin: 0 auto 30px; }
  .hero .cta { display: grid; gap: 14px; max-width: 440px; margin: 0 auto; }
  .hero .example-link { background: none; border: none; color: var(--teal-deep); font-family: var(--sans); font-size: 17px; font-weight: 640; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
  .trust { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 28px; font-size: 15px; color: var(--ink-soft); }
  .trust span { display: inline-flex; align-items: center; gap: 7px; }

  .lede { text-align: center; padding: 8px 8px 4px; }
  .lede .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-deep); }
  .lede h1 { font-size: clamp(28px, 4.6vw, 40px); margin: 10px auto 8px; max-width: 20ch; }
  .lede p { font-size: 18px; color: var(--ink-soft); max-width: 46ch; margin: 0 auto; }

  .block { padding: 24px 26px; margin-top: 20px; position: relative; transition: opacity .35s ease, filter .35s ease; }
  .block > .lbl { display: block; font-family: var(--serif); font-size: 22px; margin-bottom: 4px; }
  .block > .sub { font-size: 16px; color: var(--ink-soft); margin: 0 0 16px; }
  .block .stepnum { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--teal); color: #fff; font-family: var(--sans); font-size: 15px; font-weight: 700; margin-right: 10px; vertical-align: 2px; }

  /* progressive lock */
  .block.locked { opacity: .4; filter: saturate(.55); pointer-events: none; user-select: none; }
  .block.locked .stepnum { background: var(--line); color: var(--ink-soft); }
  .locktag { display: none; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 680; color: var(--ink-soft); background: var(--paper-2); border-radius: 999px; padding: 7px 15px; margin-bottom: 14px; width: fit-content; }
  .block.locked .locktag { display: inline-flex; }
  .block.done > .lbl .stepnum { background: var(--green); }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chipbtn { font-family: var(--sans); font-size: 18px; font-weight: 640; padding: 12px 20px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  .chipbtn:hover { border-color: var(--teal); color: var(--teal-deep); }
  .chipbtn.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .field { width: 100%; font-family: var(--sans); font-size: 19px; padding: 15px 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); margin-top: 14px; }
  .field:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-color: var(--teal); }
  textarea.field { min-height: 120px; resize: vertical; line-height: 1.5; }

  .progress { display: flex; align-items: center; gap: 14px; margin: 26px 4px 4px; }
  .progress .bar { flex: 1; height: 14px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .progress .bar b { display: block; height: 100%; width: 0%; background: var(--green); border-radius: 999px; transition: width .5s ease; }
  .progress .lbl { font-size: 16px; font-weight: 680; color: var(--ink-soft); white-space: nowrap; }

  .list { display: grid; gap: 15px; margin-top: 8px; }
  .row { display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 22px 24px; align-items: start; }
  .check { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; font-size: 22px; color: transparent; transition: all .18s ease; margin-top: 2px; }
  .check:hover { border-color: var(--teal); }
  .row.have .check { background: var(--green); border-color: var(--green); color: #fff; }
  .row.have .title { text-decoration: line-through; text-decoration-color: var(--green); color: var(--ink-soft); }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title { font-family: var(--serif); font-size: 22px; font-weight: 560; }
  .plain { font-size: 16.5px; margin: 8px 0 0; }
  .how { font-size: 15.5px; color: var(--ink-soft); margin: 10px 0 0; padding: 12px 16px; background: var(--paper-2); border-radius: 12px; }
  .how b { color: var(--ink); }

  .trustbar { text-align: center; margin: 26px auto 0; font-size: 14.5px; font-weight: 640; color: var(--teal-deep); background: var(--teal-tint); border-radius: 999px; padding: 9px 20px; display: inline-flex; align-items: center; gap: 8px; }
  .trustwrap { text-align: center; }

  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 26px; }
  .cta-row .btn { flex: 1; min-width: 220px; }
  .restart { display: inline-flex; gap: 8px; margin: 22px auto 0; background: none; border: none; color: var(--ink-soft); font-family: var(--sans); font-size: 16px; font-weight: 640; cursor: pointer; }
  .center { text-align: center; }
  @media print { .brand .tag, .cta-row, .check, .restart, .backlink, .locktag { display: none; } body { background: #fff; } }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">◆</div>
    <div class="name">Ortho<span>Appeals</span></div>
    <div class="tag">Version B · One page, one step at a time</div>
  </div>

  <div class="stage"><div id="root"></div></div>

  <a class="backlink" href="../index.html">← All versions</a>

  <script src="../assets/data.js"></script>
  <script>
    const D = window.APPEAL;
    const REQ = D.requirements;
    const root = document.getElementById('root');
    const A = { surgery: '', insurer: '', letter: '', have: {} }; // starts EMPTY
    let started = false;

    function showHero() {
      started = false;
      root.innerHTML = `
        <section class="hero rise">
          <div class="promise-kicker">Free · Plain language · Takes a few minutes</div>
          <h1>${D.product.tagline}</h1>
          <p>${D.product.promise}</p>
          <div class="cta">
            <button class="btn btn-primary btn-lg" id="start">Start my appeal →</button>
            <button class="example-link" id="ex">Or see how it works with an example</button>
          </div>
          <div class="trust">
            <span>🔒 Private — nothing leaves your computer</span>
            <span>💬 No insurance jargon</span>
            <span>📄 Ends with a ready appeal packet</span>
          </div>
        </section>`;
      document.getElementById('start').onclick = () => { started = true; drawPage(); };
      document.getElementById('ex').onclick = loadExample;
    }

    function loadExample() {
      const ex = D.example;
      A.surgery = ex.surgery; A.insurer = ex.plan; A.letter = ex.denialLetter;
      A.have = {}; REQ.forEach(r => A.have[r.id] = true);
      started = true; drawPage();
    }

    function drawPage() {
      root.innerHTML = `
        <section class="lede rise">
          <div class="eyebrow">Your appeal, one step at a time</div>
          <h1>Answer one question, and the next one opens up</h1>
          <p>Nothing here is required. We reveal each step as you go, so it never feels like a wall of questions.</p>
        </section>

        <div class="card block" id="b-surg">
          <span class="lbl"><span class="stepnum">1</span>Which surgery did they say no to?</span>
          <p class="sub">Pick one, or type your own.</p>
          <div class="chips" id="surg">
            ${D.surgeries.map(s => `<button class="chipbtn${A.surgery === s ? ' on' : ''}" data-s="${s}">${s}</button>`).join('')}
          </div>
          <input class="field" id="sother" placeholder="Or type another surgery" value="${A.surgery && !D.surgeries.includes(A.surgery) ? A.surgery : ''}" />
        </div>

        <div class="card block" id="b-ins">
          <div class="locktag">🔒 Answer step 1 first</div>
          <span class="lbl"><span class="stepnum">2</span>Who's your insurance company?</span>
          <p class="sub">The name on your insurance card is fine — for example, Aetna or Medicare.</p>
          <input class="field" id="ins" placeholder="Your insurance's name" value="${A.insurer}" />
        </div>

        <div id="b-rest">
          <div class="card block" id="b-letter">
            <div class="locktag">🔒 Answer step 2 first</div>
            <span class="lbl"><span class="stepnum">3</span>Have the letter they sent you? (optional)</span>
            <p class="sub">Paste it and we'll use the right words in your appeal. No letter? Skip it.</p>
            <textarea class="field" id="lt" placeholder="Paste your denial letter here…">${A.letter}</textarea>
          </div>

          <div class="card block" id="b-list-block">
            <div class="locktag">🔒 Answer step 2 first</div>
            <span class="lbl"><span class="stepnum">4</span>Check off anything you've already done</span>
            <p class="sub">We'll help you get the rest — no rush.</p>
            <div class="progress">
              <div class="bar"><b id="fill"></b></div>
              <div class="lbl" id="plbl"></div>
            </div>
            <main class="list" id="list"></main>
          </div>

          <div class="trustwrap"><div class="trustbar">🔒 Always free · No email or credit card — ever.</div></div>

          <div class="cta-row">
            <button class="btn btn-primary btn-lg" id="build">Build my appeal packet</button>
            <button class="btn btn-ghost btn-lg" onclick="window.print()">Print this page</button>
          </div>
          <div class="center"><button class="restart" id="restart">← Start over</button></div>
        </div>`;

      // surgery chips
      root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
        A.surgery = A.surgery === b.dataset.s ? '' : b.dataset.s;
        root.querySelector('#sother').value = '';
        root.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x.dataset.s === A.surgery));
        updateLocks();
      });
      root.querySelector('#sother').oninput = e => {
        A.surgery = e.target.value.trim();
        root.querySelectorAll('[data-s]').forEach(x => x.classList.remove('on'));
        updateLocks();
      };
      root.querySelector('#ins').oninput = e => { A.insurer = e.target.value.trim(); updateLocks(); };
      root.querySelector('#lt').oninput = e => { A.letter = e.target.value.trim(); };

      const list = root.querySelector('#list');
      list.innerHTML = REQ.map(r => `
        <div class="row card${A.have[r.id] ? ' have' : ''}" data-id="${r.id}" style="box-shadow:none">
          <div class="check" role="checkbox" aria-checked="${!!A.have[r.id]}" tabindex="0" aria-label="Mark ${r.title} as done">✓</div>
          <div>
            <div class="top"><span class="title">${r.title}</span></div>
            <p class="plain">${r.q}</p>
            <p class="how"><b>If you don't have it yet:</b> ${r.how}</p>
          </div>
        </div>`).join('');

      list.querySelectorAll('.check').forEach(box => {
        const row = box.closest('.row');
        const toggle = () => {
          const id = row.dataset.id;
          A.have[id] = !A.have[id];
          row.classList.toggle('have', A.have[id]);
          box.setAttribute('aria-checked', !!A.have[id]);
          refresh();
        };
        box.onclick = toggle;
        box.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } };
      });

      root.querySelector('#restart').onclick = () => { A.surgery=''; A.insurer=''; A.letter=''; A.have={}; showHero(); };
      updateLocks(false); // set initial lock state without scrolling
      refresh();
    }

    let prevInsUnlocked = false, prevRestUnlocked = false;

    function updateLocks(animate = true) {
      const insUnlocked = !!A.surgery;
      const restUnlocked = insUnlocked && !!A.insurer;
      const ins = root.querySelector('#b-ins');
      const letter = root.querySelector('#b-letter');
      const listBlock = root.querySelector('#b-list-block');
      root.querySelector('#b-surg').classList.toggle('done', insUnlocked);
      ins.classList.toggle('locked', !insUnlocked);
      ins.classList.toggle('done', restUnlocked);
      letter.classList.toggle('locked', !restUnlocked);
      listBlock.classList.toggle('locked', !restUnlocked);

      // When answering one step unlocks the next, glide it into view.
      if (animate) {
        if (insUnlocked && !prevInsUnlocked) revealBlock(ins);
        else if (restUnlocked && !prevRestUnlocked) revealBlock(letter);
      }
      prevInsUnlocked = insUnlocked;
      prevRestUnlocked = restUnlocked;
    }

    function revealBlock(el) {
      requestAnimationFrame(() => {
        const y = el.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top: y, behavior: 'smooth' });
      });
    }

    function refresh() {
      const done = REQ.filter(r => A.have[r.id]).length;
      root.querySelector('#fill').style.width = (done / REQ.length * 100) + '%';
      root.querySelector('#plbl').textContent = `${done} of ${REQ.length} ready`;
    }

    showHero();
  </script>
</body>
</html>

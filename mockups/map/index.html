<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrthoAppeals: appeal a denied surgery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;640;680&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/base.css" />
<style>
  .stage { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 6px 24px 40px; }
  .stage.flowing { max-width: 940px; }

  /* hero / landing */
  .hero { text-align: center; padding: 26px 8px 10px; }
  .hero .promise-kicker { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-deep); }
  .hero h1 { font-size: clamp(34px, 6vw, 56px); margin: 14px auto 16px; max-width: 16ch; }
  .hero p { font-size: 21px; color: var(--ink-soft); max-width: 52ch; margin: 0 auto 30px; }
  .hero .cta { display: grid; gap: 14px; max-width: 440px; margin: 0 auto; }
  .hero .example-link { background: none; border: none; color: var(--teal-deep); font-family: var(--sans); font-size: 17px; font-weight: 640; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
  .hero .trust { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 28px; font-size: 15px; color: var(--ink-soft); }
  .hero .trust span { display: inline-flex; align-items: center; gap: 7px; }

  /* two-column layout */
  .cols { display: grid; grid-template-columns: 250px 1fr; gap: 26px; align-items: start; }

  .rail { padding: 18px 15px; position: sticky; top: 16px; }
  .railhead { font-family: var(--serif); font-size: 18px; margin: 2px 6px 4px; }
  .railsub { font-size: 13px; color: var(--ink-soft); margin: 0 6px 12px; }
  .rstep { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; font-family: var(--sans); font-size: 15.5px; font-weight: 640; color: var(--ink-soft); padding: 9px 8px; border-radius: 10px; cursor: default; }
  .rstep .rmark { width: 27px; height: 27px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13.5px; font-weight: 700; background: var(--paper-2); color: var(--ink-soft); border: 2px solid var(--line); transition: .2s; }
  .rstep.up { opacity: .48; }
  .rstep.on { color: var(--ink); }
  .rstep.on .rmark { background: var(--teal); color: #fff; border-color: var(--teal); transform: scale(1.06); }
  .rstep.done { color: var(--ink); }
  .rstep.done .rmark { background: var(--green); color: #fff; border-color: var(--green); }
  .rstep[data-jump] { cursor: pointer; }
  .rstep[data-jump]:hover { background: var(--paper-2); }
  .rstep:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .panel { padding: 36px 34px; text-align: center; }
  .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-deep); }
  .panel h2 { font-size: clamp(24px, 3.6vw, 33px); margin: 10px 0 8px; }
  .panel .help { font-size: 17px; color: var(--ink-soft); margin: 0 auto 24px; max-width: 42ch; }
  .answers { display: grid; gap: 13px; max-width: 460px; margin: 0 auto; }
  .field { width: 100%; font-family: var(--sans); font-size: 20px; padding: 16px 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); }
  .field:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-color: var(--teal); }
  textarea.field { min-height: 150px; resize: vertical; line-height: 1.5; }
  .back { display: inline-flex; gap: 8px; margin-top: 20px; background: none; border: none; color: var(--ink-soft); font-family: var(--sans); font-size: 17px; font-weight: 640; cursor: pointer; }

  .trustbar { text-align: center; margin: 22px auto 0; font-size: 14.5px; font-weight: 640; color: var(--teal-deep); background: var(--teal-tint); border-radius: 999px; padding: 9px 20px; display: inline-flex; align-items: center; gap: 8px; }
  .trustwrap { text-align: center; }

  /* summary */
  .band { background: var(--teal-tint); color: var(--teal-deep); border-radius: 14px; padding: 16px 20px; font-size: 18px; font-weight: 640; max-width: 540px; margin: 0 auto 22px; }
  .sum { display: grid; gap: 13px; text-align: left; max-width: 560px; margin: 0 auto 24px; }
  .sum .item { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 18px 20px; align-items: start; }
  .sum .item .ic { font-size: 22px; }
  .sum .item h3 { font-size: 19px; margin-bottom: 3px; }
  .sum .item p { font-size: 15.5px; color: var(--ink-soft); margin: 0; }
  .sum .item .chip { margin-top: 8px; }

  /* live run + finished packet */
  .runbox { display: flex; gap: 16px; align-items: center; justify-content: center; text-align: left; max-width: 460px; margin: 0 auto; padding: 18px 20px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); }
  .spin { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--teal); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .runline { font-size: 16px; font-weight: 640; }
  .runtime { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .pkt { text-align: left; max-width: 620px; margin: 0 auto 18px; padding: 18px 20px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); }
  .pkt h3 { font-size: 19px; margin-bottom: 6px; }
  .pkt p { font-size: 16px; color: var(--ink-soft); margin: 0; }
  .pkt ul, .pkt ol { font-size: 16px; color: var(--ink-soft); margin: 0; padding-left: 22px; }
  .pkt li { margin-bottom: 7px; }
  .pkt.warn { border-color: var(--amber); background: var(--amber-tint); }

  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr; gap: 14px; }
    .rail { position: static; display: flex; overflow-x: auto; gap: 6px; padding: 12px; -webkit-overflow-scrolling: touch; }
    .railhead, .railsub { display: none; }
    .rstep { flex: 0 0 auto; width: auto; padding: 8px 12px 8px 8px; }
    .rstep .rname { white-space: nowrap; }
    .panel { padding: 30px 22px; }
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">◆</div>
    <div class="name">Ortho<span>Appeals</span></div>
    <div class="tag">Free help appealing a denied surgery</div>
  </div>

  <div class="stage" id="stage"><div id="app"></div></div>

  <script src="../assets/data.js"></script>
  <script>
    const D = window.APPEAL;
    const REQ = D.requirements;

    // One page serves both devices. Layout adapts through the media query below;
    // this flag adapts the WORDING, so a phone visitor is told to photograph the
    // letter and a computer visitor is told to attach a file, instead of both.
    const IS_PHONE = Math.min(
      window.innerWidth,
      window.screen ? window.screen.width : window.innerWidth) <= 768;
    document.documentElement.dataset.device = IS_PHONE ? 'phone' : 'desktop';
    const LETTER_HINT = IS_PHONE
      ? 'Take a picture of it with your phone, or add a PDF or screenshot.'
      : 'Add a PDF, a photo, or a screenshot from your computer.';
    const app = document.getElementById('app');
    const stage = document.getElementById('stage');

    // Imaging questions are derived from the chosen bodyPart (knee → X-ray only;
    // everything else → X-ray + MRI). Returns the imaging requirement objects.
    function imagingFor(bodyPart) {
      const ids = D.imagingByBodyPart[bodyPart] || D.imagingByBodyPart._default;
      return ids.map(id => D.imaging[id]);
    }
    // The full requirement list for this appeal = flat requirements + bodyPart imaging.
    function reqList() { return [...REQ, ...imagingFor(A.bodyPart)]; }
    // Look up any requirement (flat or imaging) by id.
    function reqById(id) { return reqList().find(r => r.id === id); }

    // The flow rebuilds when bodyPart changes so imaging steps track the choice.
    // Initial buildFlow() is called AFTER `A` is declared (below) to avoid a
    // temporal-dead-zone error, since reqList() reads A.bodyPart.
    let flow = [];
    function buildFlow() {
      flow = ['surgery', 'state', 'insurer', 'letter', ...reqList().map(r => r.id), 'summary'];
    }
    const stepName = key => {
      if (key === 'surgery') return 'Your surgery';
      if (key === 'state') return 'Your state';
      if (key === 'insurer') return 'Your insurance';
      if (key === 'letter') return 'Denial letter';
      if (key === 'summary') return 'Your appeal packet';
      const r = reqById(key);
      return r ? r.title : key;
    };

    let started = false, i = 0;
    // catId = chosen category, bodyPart drives imaging + insurer/state gating.
    const A = { catId: '', surgery: '', cpt: '', bodyPart: '', state: '', insurer: '', letter: '', letterFiles: [], letterName: '', req: {} }; // starts EMPTY
    buildFlow(); // now safe: A exists

    // The imaging steps (and therefore flow length + the rail) change with the
    // chosen bodyPart. Call this after buildFlow() so the two-column shell/rail
    // rebuilds from the new flow instead of keeping the stale step list.
    function rebuildShell() { const c = app.querySelector('.cols'); if (c) c.remove(); }

    function showHero() {
      started = false; stage.classList.remove('flowing');
      app.innerHTML = `
        <section class="hero rise">
          <div class="promise-kicker">Free · Plain language · Takes a few minutes</div>
          <h1>${D.product.tagline}</h1>
          <p>${D.product.promise}</p>
          <div class="cta">
            <button class="btn btn-primary btn-lg" id="start">Start my appeal →</button>
            <button class="example-link" id="ex">Or see how it works with an example</button>
          </div>
          <div class="trust">
            <span>🔒 Private. Nothing leaves your ${IS_PHONE ? 'phone' : 'computer'}</span>
            <span>💬 No insurance jargon</span>
            <span>📄 Ends with a ready appeal packet</span>
          </div>
        </section>`;
      document.getElementById('start').onclick = () => { started = true; i = 0; render(); };
      document.getElementById('ex').onclick = loadExample;
    }

    function loadExample() {
      const ex = D.example;
      A.surgery = ex.surgery; A.bodyPart = 'knee'; A.catId = 'knee';
      A.state = 'California'; A.insurer = ex.plan; A.letter = ex.denialLetter;
      buildFlow();
      A.req = {}; reqList().forEach(r => A.req[r.id] = { have: true, note: ex.answers[r.id] });
      started = true; i = flow.length - 1; render();
    }

    function railHTML() {
      const done = i;
      const steps = flow.map((key, idx) => {
        const st = idx < i ? 'done' : idx === i ? 'on' : 'up';
        const jump = idx < i ? ` data-jump="${idx}"` : ' disabled';
        const mark = idx < i ? '✓' : (idx + 1);
        const cur = idx === i ? ' aria-current="step"' : '';
        return `<button class="rstep ${st}"${jump}${cur}>
          <span class="rmark">${mark}</span><span class="rname">${stepName(key)}</span></button>`;
      }).join('');
      return `<div class="railhead">Your appeal</div>
        <p class="railsub">${done} of ${flow.length} steps done. Every step is right here.</p>${steps}`;
    }

    function render() {
      if (!started) return showHero();
      stage.classList.add('flowing');
      // Build the two-column shell once; afterwards update the rail IN PLACE so its
      // scroll position is kept and the active step advances one at a time
      // (step N → N+1) instead of the strip resetting to step 1 and racing across.
      if (!app.querySelector('.cols')) {
        app.innerHTML = `
          <div class="cols">
            <aside class="rail card">${railHTML()}</aside>
            <section>
              <div id="q"></div>
              <div class="trustwrap"><div class="trustbar">🔒 Always free · No email or credit card, ever.</div></div>
              <div id="backwrap" style="text-align:center"></div>
            </section>
          </div>`;
      }
      updateRail();
      updateBack();
      drawStep();
      centerActiveStep();
    }

    function updateRail() {
      const rail = app.querySelector('.rail');
      if (!rail) return;
      rail.querySelectorAll('.rstep').forEach((btn, idx) => {
        const st = idx < i ? 'done' : idx === i ? 'on' : 'up';
        btn.className = 'rstep ' + st;
        btn.querySelector('.rmark').textContent = idx < i ? '✓' : (idx + 1);
        if (idx < i) {
          btn.dataset.jump = idx; btn.removeAttribute('disabled');
          btn.onclick = () => { i = idx; render(); };
        } else {
          delete btn.dataset.jump; btn.setAttribute('disabled', ''); btn.onclick = null;
        }
        if (idx === i) btn.setAttribute('aria-current', 'step'); else btn.removeAttribute('aria-current');
      });
      const sub = rail.querySelector('.railsub');
      if (sub) sub.textContent = `${i} of ${flow.length} steps done. Every step is right here.`;
    }

    function updateBack() {
      const wrap = app.querySelector('#backwrap');
      if (!wrap) return;
      if (i > 0) {
        wrap.innerHTML = `<button class="back" id="back">← Go back</button>`;
        wrap.querySelector('#back').onclick = () => { i = Math.max(0, i - 1); render(); };
      } else {
        wrap.innerHTML = '';
      }
    }

    // On mobile the roadmap is a horizontal strip; keep the active step in view.
    function centerActiveStep() {
      const rail = app.querySelector('.rail');
      if (!rail) return;
      const active = rail.querySelector('.rstep.on');
      if (!active) return;
      requestAnimationFrame(() => {
        const r = rail.getBoundingClientRect();
        const a = active.getBoundingClientRect();
        const delta = (a.left - r.left) - (r.width - a.width) / 2;
        if (Math.abs(delta) > 1) rail.scrollBy({ left: delta, behavior: 'smooth' });
      });
    }

    function panel(inner) { document.getElementById('q').innerHTML = `<div class="card panel rise">${inner}</div>`; }

    function drawStep() {
      const key = flow[i];
      if (key === 'surgery') return drawSurgery();
      if (key === 'state') return drawState();
      if (key === 'insurer') return drawInsurer();
      if (key === 'letter') return drawLetter();
      if (key === 'summary') return drawSummary();
      drawReq(reqById(key));
    }

    // Two-part picker: first pick a body-area category, then a specific
    // procedure (or type your own). Choosing sets A.bodyPart, which drives the
    // imaging questions and rebuilds the flow.
    function drawSurgery() {
      if (!A.catId) return drawCategory();
      return drawSubtype();
    }

    function drawCategory() {
      panel(`
        <h2>Let's start simple. What kind of surgery did they say no to?</h2>
        <p class="help">Pick the part of the body. Next you'll choose the exact surgery, or you can type your own.</p>
        <div class="answers">
          ${D.procedureCategories.map(c => `<button class="btn btn-ghost btn-lg" data-cat="${c.id}">${c.label}</button>`).join('')}
          <button class="btn btn-ghost btn-lg" data-cat="__other">My surgery isn't listed here</button>
        </div>`);
      document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
        if (b.dataset.cat === '__other') {
          A.catId = '__other'; A.bodyPart = ''; A.surgery = ''; A.cpt = '';
        } else {
          const c = D.procedureCategories.find(x => x.id === b.dataset.cat);
          A.catId = c.id; A.bodyPart = c.bodyPart; A.surgery = ''; A.cpt = '';
        }
        buildFlow(); rebuildShell(); A.req = {}; render(); // re-draw same step (now the subtype view)
      });
    }

    function drawSubtype() {
      if (A.catId === '__other') {
        panel(`
          <h2>Tell us the surgery in your own words</h2>
          <p class="help">Whatever the letter or your doctor called it is fine. This is just so we use the right words in your appeal.</p>
          <div class="answers">
            <input class="field" id="sother" placeholder="Type your surgery" value="${A.surgery || ''}" />
            <button class="btn btn-primary btn-lg" id="s-next">Continue →</button>
            <button class="btn btn-ghost btn-lg" id="s-back-cat">← Pick from the list instead</button>
          </div>`);
        const f = document.getElementById('sother'); f.focus();
        const go = () => { if (f.value.trim()) { A.surgery = f.value.trim(); next(); } };
        document.getElementById('s-next').onclick = go;
        f.onkeydown = e => { if (e.key === 'Enter') go(); };
        document.getElementById('s-back-cat').onclick = () => { A.catId=''; A.bodyPart=''; A.surgery=''; buildFlow(); rebuildShell(); A.req={}; render(); };
        return;
      }
      const cat = D.procedureCategories.find(c => c.id === A.catId);
      panel(`
        <h2>Which ${cat.label.toLowerCase()} surgery did they say no to?</h2>
        <p class="help">Pick the closest one, or type your own. This is just so we use the right words in your appeal.</p>
        <div class="answers">
          ${cat.procedures.map(p => `<button class="btn btn-ghost btn-lg" data-p="${p.id}">${p.label}<span style="display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:2px">CPT ${p.cpt}</span></button>`).join('')}
          <input class="field" id="sother" placeholder="My procedure isn't listed. Type it here" value="${A.surgery && !cat.procedures.some(p=>p.label===A.surgery) ? A.surgery : ''}" />
          <button class="btn btn-ghost btn-lg" id="s-back-cat">← Pick a different body part</button>
        </div>`);
      document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
        const p = cat.procedures.find(x => x.id === b.dataset.p);
        A.surgery = p.label; A.bodyPart = p.bodyPart; A.cpt = p.cpt; buildFlow(); rebuildShell(); A.req={}; next();
      });
      document.getElementById('sother').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { A.surgery = e.target.value.trim(); A.cpt = ''; A.bodyPart = cat.bodyPart; buildFlow(); rebuildShell(); A.req={}; next(); } };
      document.getElementById('s-back-cat').onclick = () => { A.catId=''; A.bodyPart=''; A.surgery=''; buildFlow(); A.req={}; render(); };
    }

    function drawState() {
      panel(`
        <h2>Which state are you in?</h2>
        <p class="help">Insurance plans are different in each state, so this helps us show the right plans next.</p>
        <div class="answers">
          <select class="field" id="stsel">
            <option value="">Choose your state…</option>
            ${D.states.map(s => `<option value="${s}"${A.state === s ? ' selected' : ''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-primary btn-lg" id="st-next">Continue →</button>
        </div>`);
      const sel = document.getElementById('stsel');
      const go = () => { if (sel.value) { A.state = sel.value; next(); } };
      document.getElementById('st-next').onclick = go;
      sel.onchange = () => { A.state = sel.value; };
    }

    function drawInsurer() {
      // Insurer picker is filtered by the chosen state; always keep a free-text
      // fallback. Curated names where we have them, otherwise a generic set.
      const curated = D.insurersByState[A.state];
      const options = curated || D.insurersGeneric;
      const isCurated = !!curated;
      panel(`
        <h2>Who's your insurance company?</h2>
        <p class="help">${isCurated ? `Here are plans we often see in ${A.state}.` : `Here are common plans.`} Pick yours, or type it in if it's not here.</p>
        <div class="answers">
          ${options.map(name => `<button class="btn btn-ghost btn-lg" data-ins="${name}"${A.insurer === name ? ' style="border-color:var(--teal)"' : ''}>${name}</button>`).join('')}
          <input class="field" id="ins" placeholder="My plan isn't listed. Type it here" value="${A.insurer && !options.includes(A.insurer) ? A.insurer : ''}" />
          <button class="btn btn-primary btn-lg" id="ins-next">Continue →</button>
        </div>`);
      document.querySelectorAll('[data-ins]').forEach(b => b.onclick = () => { A.insurer = b.dataset.ins; next(); });
      const f = document.getElementById('ins');
      const go = () => { const t = f.value.trim(); if (t) A.insurer = t; if (A.insurer) next(); };
      document.getElementById('ins-next').onclick = go;
      f.onkeydown = e => { if (e.key === 'Enter') go(); };
    }

    function drawLetter() {
      const chosen = A.letterFiles && A.letterFiles.length;
      panel(`
        <h2>Let's start with your denial letter</h2>
        <p class="help">This is the most important step. Your letter is the only place that says exactly what was turned down, so a clear photo or copy of it helps us the most.</p>
        <div class="answers">
          <label class="letter-up${chosen ? ' chosen' : ''}" id="lt-drop">
            <input type="file" id="lt-file" accept="image/*,application/pdf" ${IS_PHONE ? 'capture="environment"' : ''} multiple />
            <span class="up-ic">${chosen ? '✓' : (IS_PHONE ? '📷' : '📄')}</span>
            <span class="up-head" id="lt-head">${chosen ? 'Letter attached' : (IS_PHONE ? 'Take a photo of your denial letter' : 'Upload your denial letter')}</span>
            <p class="up-sub" id="lt-sub">${chosen ? A.letterName : LETTER_HINT}</p>
            <div class="up-formats">Photo, PDF, or screenshot: whatever you have is fine</div>
          </label>

          <details class="letter-paste"${A.letter ? ' open' : ''}>
            <summary>Or paste the text instead</summary>
            <textarea class="field" id="lt" placeholder="Paste your denial letter here…">${A.letter}</textarea>
          </details>

          <button class="btn btn-primary btn-lg" id="lt-yes">Continue →</button>
          <button class="letter-skip" id="lt-no">I can't find my letter right now</button>
        </div>`);

      const drop = document.getElementById('lt-drop');
      document.getElementById('lt-file').onchange = e => {
        const files = Array.from(e.target.files || []);
        A.letterFiles = files;
        A.letterName = files.length === 1 ? files[0].name
          : (files.length ? files.length + ' files attached' : '');
        drop.classList.toggle('chosen', !!files.length);
        document.getElementById('lt-head').textContent = files.length ? 'Letter attached'
          : (IS_PHONE ? 'Take a photo of your denial letter' : 'Upload your denial letter');
        drop.querySelector('.up-ic').textContent = files.length ? '✓' : (IS_PHONE ? '📷' : '📄');
        document.getElementById('lt-sub').textContent = files.length ? A.letterName : LETTER_HINT;
      };
      document.getElementById('lt-yes').onclick = () => { A.letter = document.getElementById('lt').value.trim(); next(); };
      document.getElementById('lt-no').onclick = () => { A.letter = ''; A.letterFiles = []; A.letterName = ''; next(); };
    }

    // How many of the four conservative-care questions the patient has said "yes"
    // to so far. It drives the gentle 2-of-4 reassurance (never a hard gate).
    function reqYesCount() {
      return REQ.filter(x => A.req[x.id]?.have).length;
    }

    function drawReq(r) {
      // Prepopulate from the clinical default ("yes" for the conservative-care
      // questions) the first time this step is shown, so most patients can just
      // confirm. The patient can still change it; nothing here is locked.
      if (A.req[r.id] === undefined && r.default) {
        A.req[r.id] = { have: r.default === 'yes', answer: r.default };
      }
      const cur = A.req[r.id]?.answer || '';
      const isReq = REQ.some(x => x.id === r.id); // a conservative-care question
      const yes = reqYesCount();
      const reassure = (isReq && (D.requirementsIntro))
        ? `<p class="help" style="color:var(--teal-deep)">${D.requirementsIntro}${yes ? ` <b>You've noted ${yes} so far.</b>` : ''}</p>`
        : '';
      const sel = v => cur === v ? ' btn-primary' : ' btn-ghost';
      panel(`
        <h2>${r.q}</h2>
        <p class="help">${r.why}</p>
        <div class="answers">
          <button class="btn btn-lg${cur ? sel('yes') : ' btn-primary'}" data-h="yes">Yes</button>
          <button class="btn btn-lg${sel('no')}" data-h="no">No / not yet</button>
          <button class="btn btn-lg${sel('unsure')}" data-h="unsure">I'm not sure</button>
        </div>
        <div id="followup"></div>
        ${reassure}
        <div class="answers" style="margin-top:16px">
          <button class="btn btn-primary btn-lg" id="req-next">Continue →</button>
        </div>`);

      function drawFollowup() {
        const fu = document.getElementById('followup');
        if (!fu) return;
        // Light lasting-vs-not nuance, only when the answer is "yes".
        if (r.followup && A.req[r.id]?.have) {
          const chosen = A.req[r.id]?.lasting;
          fu.innerHTML = `
            <p class="help" style="margin-top:16px">${r.followup.q}</p>
            <div class="answers">
              ${r.followup.options.map(o => `<button class="btn btn-lg${A.req[r.id]?.followup === o.id ? ' btn-primary' : ' btn-ghost'}" data-fu="${o.id}">${o.label}</button>`).join('')}
            </div>`;
          fu.querySelectorAll('[data-fu]').forEach(b => b.onclick = () => {
            const o = r.followup.options.find(x => x.id === b.dataset.fu);
            A.req[r.id].followup = o.id; A.req[r.id].lasting = o.lasting;
            drawFollowup();
          });
        } else {
          fu.innerHTML = '';
        }
      }
      drawFollowup();

      document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
        const have = b.dataset.h === 'yes';
        A.req[r.id] = { have, answer: b.dataset.h };
        // Re-render so the selection highlight, reassurance count, and the
        // yes-only followup all update in place (answer stays editable).
        drawReq(r);
      });
      document.getElementById('req-next').onclick = () => {
        if (!A.req[r.id]?.answer) A.req[r.id] = { have: false, answer: 'no' };
        next();
      };
    }

    // ---- Optional "tell us your story" free-text + voice-to-text -----------
    // Feature-detect the Web Speech API (Chrome/Edge-ish; Firefox/Safari may
    // lack it). If missing, the mic is never rendered and typing stays the only
    // path, so the control is never broken. Typing is always available.
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    A.story = A.story || '';

    // Heuristic for "thin structured input": did the patient give us enough to
    // build a strong appeal, or should we gently ask them to tell their story?
    // Keys entirely off the existing in-memory state (A), non-blocking.
    function structuredThin() {
      const noLetter = !(A.letter && A.letter.trim()) && !(A.letterFiles && A.letterFiles.length);
      const cat = D.procedureCategories.find(c => c.id === A.catId);
      const unlistedProcedure = A.catId === '__other'
        || (cat && A.surgery && !cat.procedures.some(p => p.label === A.surgery));
      const yes = reqYesCount(); // conservative-care "yes" answers so far
      const thinCare = yes < 2;
      return noLetter || unlistedProcedure || thinCare;
    }

    // Renders the story block (heading, optional-copy, mic if supported,
    // textarea) into the element with id="storywrap". Safe to call repeatedly.
    function drawStory() {
      const wrap = document.getElementById('storywrap');
      if (!wrap) return;
      const thin = structuredThin();
      const prompt = thin
        ? `<p class="help story-nudge">We still need a bit more to build a strong appeal. Tell us your story in your own words${SpeechRec ? ' (you can speak it)' : ''}. A few sentences about how this has affected your day-to-day life can make a real difference.</p>`
        : `<p class="help">Optional, but a few sentences in your own words about how this has affected your life can strengthen your appeal.</p>`;
      const micBtn = SpeechRec
        ? `<button type="button" class="mic-btn" id="mic" aria-pressed="false" aria-label="Dictate your story with your voice">
             <span class="mic-ic" aria-hidden="true">🎙️</span><span class="mic-lbl">Speak instead</span>
           </button>`
        : '';
      wrap.innerHTML = `
        <div class="story-block">
          <div class="story-head">Anything else you'd like us to know?</div>
          ${prompt}
          <div class="story-input">
            <textarea class="field" id="story" placeholder="Tell us your story, in your own words…">${A.story || ''}</textarea>
            ${micBtn}
          </div>
        </div>`;
      const ta = wrap.querySelector('#story');
      ta.oninput = () => { A.story = ta.value; };
      if (SpeechRec) wireMic(wrap.querySelector('#mic'), ta);
    }

    // Start/stop voice dictation, appending recognized transcript to the
    // textarea and showing a visible "listening…" state.
    function wireMic(btn, ta) {
      if (!btn || !ta) return;
      let rec = null, listening = false;
      const stop = () => { listening = false; try { rec && rec.stop(); } catch (e) {} setIdle(); };
      const setIdle = () => {
        btn.classList.remove('listening'); btn.setAttribute('aria-pressed', 'false');
        btn.querySelector('.mic-lbl').textContent = 'Speak instead';
      };
      const setListening = () => {
        btn.classList.add('listening'); btn.setAttribute('aria-pressed', 'true');
        btn.querySelector('.mic-lbl').textContent = 'Listening… tap to stop';
      };
      btn.onclick = () => {
        if (listening) return stop();
        try {
          rec = new SpeechRec();
          rec.lang = (navigator.language || 'en-US');
          rec.interimResults = false; rec.continuous = true;
          rec.onresult = e => {
            let add = '';
            for (let k = e.resultIndex; k < e.results.length; k++) {
              if (e.results[k].isFinal) add += e.results[k][0].transcript;
            }
            if (add) {
              const sep = ta.value && !/\s$/.test(ta.value) ? ' ' : '';
              ta.value = ta.value + sep + add.trim();
              A.story = ta.value;
            }
          };
          rec.onerror = () => { listening = false; setIdle(); };
          rec.onend = () => { if (listening) { try { rec.start(); } catch (e) { listening = false; setIdle(); } } };
          rec.start(); listening = true; setListening();
        } catch (e) { listening = false; setIdle(); }
      };
    }

    function drawSummary() {
      const RL = reqList();
      const have = RL.filter(r => A.req[r.id]?.have);
      const gather = RL.filter(r => !A.req[r.id]?.have);
      const line = A.surgery ? A.surgery.toLowerCase() : 'your surgery';
      const who = A.insurer ? A.insurer : 'your insurance';
      panel(`
        <div class="eyebrow">Your appeal plan</div>
        <h2>Here's how to get ${line} approved</h2>
        <div class="band">${D.product.reassure}</div>
        ${have.length ? `<div class="sum">${have.map(r => item(r, 'have')).join('')}</div>` : ''}
        ${gather.length ? `<p class="help" style="margin-top:6px"><b>Next, gather these:</b></p><div class="sum">${gather.map(r => item(r, 'gather')).join('')}</div>` : ''}
        <div id="storywrap"></div>
        <div class="answers">
          <button class="btn btn-primary btn-lg" id="build">Build my appeal packet for ${who}</button>
          <button class="btn btn-ghost btn-lg" id="restart">Start over</button>
        </div>`);
      drawStory();
      document.getElementById('build').onclick = onBuild;
      document.getElementById('restart').onclick = resetAll;
    }

    function item(r, mode) {
      const chip = mode === 'have'
        ? `<span class="chip done"><span class="dot"></span>You have this</span>`
        : `<span class="chip request"><span class="dot"></span>Need to request</span>`;
      const note = (A.req[r.id]?.note) ? `<p>${A.req[r.id].note}</p>` : `<p>${mode === 'have' ? r.plain : r.how}</p>`;
      return `<div class="item card" style="box-shadow:none">
        <div class="ic">${mode === 'have' ? '✅' : '📎'}</div>
        <div><h3>${r.title}</h3>${note}${chip}</div>
      </div>`;
    }

    // ---- Live run against the retrieval agent -----------------------------
    // The harness also serves this page, at /patient/, so the final button can
    // reach the API on the same origin. Served as a plain static preview there
    // is no API behind it, and the button says so rather than doing nothing.
    // The API sits beside the page, wherever the page is mounted. Served straight
    // from the harness the page is at /patient/map/, so the API is at /api. Behind
    // a proxy that mounts the harness under a prefix the page is at
    // /<prefix>/patient/map/, so the API is at /<prefix>/api. Deriving the base
    // from our own path keeps both cases working without a build step.
    const API = location.pathname.replace(/\/patient\/.*$/, '') + '/api';
    let apiReady = null;
    async function hasApi() {
      if (apiReady !== null) return apiReady;
      try {
        const r = await fetch(API + '/health', { cache: 'no-store' });
        const j = await r.json();
        apiReady = r.ok && j.ok === true;
      } catch (e) { apiReady = false; }
      return apiReady;
    }

    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function li(items) { return (items || []).filter(Boolean).map(t => '<li>' + esc(t) + '</li>').join(''); }

    // Everything the patient told us, as plain lines the agent can read.
    function careNotes() {
      const lines = [];
      reqList().forEach(r => {
        const a = A.req[r.id];
        if (!a || !a.answer) return;
        const label = a.answer === 'yes' ? 'yes' : (a.answer === 'no' ? 'no / not yet' : 'not sure');
        let line = r.title + ': ' + label;
        if (a.followup && r.followup) {
          const o = r.followup.options.find(x => x.id === a.followup);
          if (o) line += ' (' + o.label + ')';
        }
        lines.push(line);
      });
      if (A.story && A.story.trim()) lines.push("In the patient's own words: " + A.story.trim());
      return lines.join('\n');
    }

    // The API needs denial-letter text. A photo cannot be sent through this
    // endpoint, so say plainly that the text is missing instead of inventing it.
    function submissionBody() {
      const names = (A.letterFiles || []).map(f => f.name).join(', ');
      const pasted = (A.letter || '').trim();
      const denial = pasted || [
        'The patient did not paste the text of the denial letter.',
        names ? 'They attached these files: ' + names + '.' : 'They could not find the letter.',
        (A.insurer || 'Their insurer') + ' denied ' + (A.surgery || 'the surgery')
          + (A.cpt ? ' (CPT ' + A.cpt + ')' : '') + '.'
      ].join(' ');
      return {
        denial_letter: denial,
        payer: A.insurer || '',
        plan_name: '',
        state: A.state || '',
        product_clue: '',
        procedure: A.surgery || '',
        cpt: A.cpt || '',
        treating_practice: '',
        patient_notes: careNotes(),
        retrieval_mode: 'web_only'
      };
    }

    const RUN = { id: null, timer: null, poll: null, startedAt: 0 };
    function stopRun() {
      if (RUN.timer) clearInterval(RUN.timer);
      if (RUN.poll) clearInterval(RUN.poll);
      RUN.timer = null; RUN.poll = null;
    }
    function setRunLine(text) {
      const el = document.getElementById('runline');
      if (el && text) el.textContent = text;
    }

    function runPanel(note) {
      panel(`
        <div class="eyebrow">Working on your appeal</div>
        <h2>Finding the exact rule ${esc(A.insurer || 'your plan')} used</h2>
        <p class="help">We are reading the published policy for ${esc((A.surgery || 'your surgery').toLowerCase())}. This takes a few minutes. You can leave this page open.</p>
        <div class="runbox">
          <div class="spin" aria-hidden="true"></div>
          <div>
            <div class="runline" id="runline">${esc(note)}</div>
            <div class="runtime" id="runtime">0:00 elapsed</div>
          </div>
        </div>
        <div class="answers" style="margin-top:20px">
          <button class="btn btn-ghost btn-lg" id="run-cancel">Stop and go back</button>
        </div>`);
      document.getElementById('run-cancel').onclick = () => { stopRun(); render(); };
      RUN.timer = setInterval(() => {
        const el = document.getElementById('runtime');
        if (!el) return;
        const s = Math.floor((Date.now() - RUN.startedAt) / 1000);
        el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' elapsed';
      }, 1000);
    }

    function previewPanel() {
      panel(`
        <div class="eyebrow">Preview only</div>
        <h2>This copy cannot run your appeal</h2>
        <p class="help">You are looking at the preview copy of the site, which has no agent behind it. The working version runs the search against your insurer's real policy. Ask Andrew for the working address.</p>
        <div class="answers"><button class="btn btn-ghost btn-lg" id="prev-back">← Go back</button></div>`);
      document.getElementById('prev-back').onclick = () => render();
    }

    function failPanel(message) {
      panel(`
        <div class="eyebrow">Something went wrong</div>
        <h2>We could not finish the search</h2>
        <p class="help">Nothing you entered was lost. You can try again.</p>
        <div class="pkt warn"><h3>What happened</h3><p>${esc(message)}</p></div>
        <div class="answers">
          <button class="btn btn-primary btn-lg" id="fail-retry">Try again</button>
          <button class="btn btn-ghost btn-lg" id="fail-back">← Go back</button>
        </div>`);
      document.getElementById('fail-retry').onclick = onBuild;
      document.getElementById('fail-back').onclick = () => render();
    }

    async function onBuild() {
      if (!(await hasApi())) return previewPanel();
      stopRun();
      RUN.startedAt = Date.now();
      runPanel('Sending your answers.');
      let snap;
      try {
        const r = await fetch(API + '/episodes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(submissionBody())
        });
        snap = await r.json();
        if (!r.ok) throw new Error(snap.error || 'The server refused the request.');
      } catch (e) {
        stopRun();
        return failPanel(e.message || String(e));
      }
      RUN.id = snap.manifest && snap.manifest.episode_id;
      if (!RUN.id) { stopRun(); return failPanel('The server did not return a case number.'); }
      setRunLine('Searching for the policy that covers your plan.');
      RUN.poll = setInterval(pollRun, 5000);
    }

    async function pollRun() {
      if (!RUN.id) return;
      let snap;
      try {
        snap = await fetch(API + '/episodes/' + RUN.id, { cache: 'no-store' }).then(r => r.json());
      } catch (e) { return; }
      const arm = (snap.arms && snap.arms.web_only) || {};
      const status = (arm.runtime && arm.runtime.status) || 'running';
      // The harness writes engineering-language events. A patient should never
      // read them, so report the stage in plain words instead of echoing them.
      const events = (snap.events || []).filter(e => e.arm === 'web_only' && e.summary);
      if (events.length) {
        const mins = (Date.now() - RUN.startedAt) / 60000;
        setRunLine(mins < 1 ? 'Looking up the published rules for your plan.'
          : mins < 4 ? 'Reading the policy document your plan follows.'
          : 'Checking your answers against that policy.');
      }
      if (status === 'completed' && arm.result) { stopRun(); packetPanel(arm.result); return; }
      if (status === 'failed') {
        stopRun();
        failPanel((arm.runtime && arm.runtime.error) || 'The search did not finish.');
      }
    }

    function packetPanel(res) {
      const src = (res.retrieval && res.retrieval.selected_source) || {};
      const pa = res.policy_analysis || {};
      const ns = res.next_steps || {};
      const qs = ((res.patient_interaction || {}).questions) || [];
      const gaps = pa.documentation_gaps || [];
      const acts = (ns.ordered_actions || []).map(a => a.action || a);
      panel(`
        <div class="eyebrow">Your appeal plan</div>
        <h2>Here is the rule ${esc(A.insurer || 'your plan')} used</h2>
        ${src.title ? `<div class="band">${esc(src.title)}</div>` : ''}
        ${src.url ? `<p class="help"><a href="${esc(src.url)}" target="_blank" rel="noopener">Read the policy yourself</a>${src.effective_date ? '. Applies to: ' + esc(src.effective_date) : ''}</p>` : ''}
        ${pa.apparent_reason ? `<div class="pkt"><h3>Why they said no</h3><p>${esc(pa.apparent_reason)}</p></div>` : ''}
        ${gaps.length ? `<div class="pkt"><h3>What your doctor still needs to show</h3><ul>${li(gaps)}</ul></div>` : ''}
        ${ns.primary_action ? `<div class="pkt"><h3>The most useful next step</h3><p>${esc(ns.primary_action)}</p></div>` : ''}
        ${acts.length ? `<div class="pkt"><h3>In order</h3><ol>${li(acts)}</ol></div>` : ''}
        ${qs.length ? `<div class="pkt"><h3>We still need to ask you</h3><ul>${li(qs.map(q => q.text))}</ul></div>` : ''}
        ${ns.safety_caveat ? `<div class="pkt warn"><h3>Please read this before you act</h3><p>${esc(ns.safety_caveat)}</p></div>` : ''}
        <div class="answers" style="margin-top:22px">
          <button class="btn btn-ghost btn-lg" id="restart2">Start over</button>
        </div>`);
      document.getElementById('restart2').onclick = resetAll;
    }

    function resetAll() {
      stopRun();
      RUN.id = null;
      A.catId=''; A.surgery=''; A.cpt=''; A.bodyPart=''; A.state=''; A.insurer='';
      A.letter=''; A.letterFiles=[]; A.letterName=''; A.req={}; A.story='';
      buildFlow(); showHero();
    }

    function next() { i = Math.min(flow.length - 1, i + 1); render(); }

    showHero();
  </script>
</body>
</html>
